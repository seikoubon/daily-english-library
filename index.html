<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily English Library</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #172b35; background: #f5f3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 28px max(20px, calc((100% - 1080px) / 2)); background: #133b46; color: white; border-bottom: 4px solid #cda56d; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; font-size: 14px; color: #cadddf; }
    main { max-width: 1080px; margin: auto; padding: 24px 18px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
    .panel { background: white; border: 1px solid #dce5e6; border-radius: 14px; padding: 20px; }
    input, select, button { font: inherit; border-radius: 9px; padding: 10px; }
    input, select { width: 100%; margin-bottom: 10px; border: 1px solid #bccdd0; }
    button { cursor: pointer; border: 1px solid #aac0c3; color: #153e46; background: #f0f6f6; }
    :focus-visible { outline: 3px solid #d39b42; outline-offset: 2px; }
    .small { font-size: 12px; color: #526b72; }
    #list { display: grid; gap: 8px; }
    .story { display: grid; gap: 6px; text-align: left; width: 100%; padding: 13px; border-color: #dce5e6; background: white; }
    .story[aria-current="true"] { border-color: #155c67; background: #eaf4f3; }
    h2 { font-size: 27px; margin: 10px 0 6px; }
    .tags, .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .tag { border-radius: 100px; background: #edf4f5; padding: 5px 10px; font-size: 12px; }
    button[aria-pressed="true"] { background: #155c67; color: white; }
    #visual img { width: 100%; height: auto; border-radius: 12px; }
    .passage { white-space: pre-line; font-size: 18px; line-height: 1.85; }
    summary { cursor: pointer; font-weight: 600; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 11px 6px; border-bottom: 1px solid #e6eded; }
    td p { font-size: 14px; font-style: italic; }
    @media (max-width: 760px) {
      main { display: block; } .panel { margin-bottom: 16px; } header { padding: 24px 18px; }
      #list { max-height: 260px; overflow: auto; } h2 { font-size: 25px; } .passage { font-size: 17px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Daily English Library</h1>
  <p>英語を読みながら、世界を学ぶ。1日3回・約400語の英語エッセイ</p>
</header>
<main>
  <aside class="panel">
    <label for="search">記事を検索</label>
    <input id="search" type="search" placeholder="タイトル・本文から検索">
    <label for="category">ジャンル</label>
    <select id="category"><option value="">すべて</option></select>
    <label for="level">難易度</label>
    <select id="level">
      <option value="">すべて</option>
      <option value="07:00">英検3級程度 · 7:00</option>
      <option value="12:00">英検準2級程度 · 12:00</option>
      <option value="17:00">英検2級程度 · 17:00</option>
      <option value="legacy">従来記事</option>
    </select>
    <p id="count" class="small" role="status">読み込み中…</p>
    <div id="list"></div>
    <hr>
    <details>
      <summary>記事JSONの入出力</summary>
      <label for="upload" class="small">このページに読み込む（再読み込みで元に戻ります）</label>
      <input id="upload" type="file" accept=".json,application/json" disabled>
      <button id="export" disabled>全記事をJSONで保存</button>
      <p id="status" class="small" role="status"></p>
    </details>
  </aside>
  <article class="panel" hidden>
    <div id="meta" class="small"></div>
    <h2 id="title" lang="en"></h2>
    <div id="subtitle" class="small"></div>
    <div class="tags"><span id="grade" class="tag"></span><span id="words" class="tag"></span></div>
    <div class="controls" aria-label="本文の表示言語">
      <button data-mode="en" aria-pressed="true">英文</button>
      <button data-mode="both" aria-pressed="false">英文＋日本語</button>
      <button data-mode="ja" aria-pressed="false">日本語訳</button>
    </div>
    <div id="visual"></div>
    <section id="english" lang="en"><h3>English</h3><p class="passage"></p></section>
    <section id="japanese" hidden><h3>日本語訳</h3><p class="passage"></p></section>
    <details open><summary>重要表現</summary><table><tbody id="vocab"></tbody></table></details>
  </article>
</main>
<script>
  const $ = selector => document.querySelector(selector);
  const grades = { '07:00': '英検3級程度', '12:00': '英検準2級程度', '17:00': '英検2級程度' };
  const prefix = /^\[(07:00|12:00|17:00)\] /;
  const slot = a => prefix.exec(a.title)?.[1] || '';
  const title = a => a.title.replace(prefix, '');
  const key = a => a.is_preview ? 'sample|' + a.date + '|' + a.title : a.date + '|' + slot(a);

  let articles = [];
  let selected;

  function element(tag, text) {
    const el = document.createElement(tag);
    el.textContent = text;
    return el;
  }

  function displayArticle(a) {
    $('#meta').textContent = [a.date, slot(a), a.category].filter(Boolean).join(' · ');
    $('#title').textContent = title(a);
    $('#subtitle').textContent = a.ja_title || '';
    $('#grade').textContent = grades[slot(a)] || '英検2級程度（従来記事）';
    $('#words').textContent = (a.is_preview ? '短縮サンプル' : '正式記事') + ' · ' + a.en.trim().split(/\s+/).length + ' words';
    $('#english p').textContent = a.en;
    $('#japanese p').textContent = a.ja;
    $('#visual').replaceChildren();
    if (a.image_url) {
      try {
        const url = new URL(a.image_url, location.href);
        if (['http:', 'https:'].includes(url.protocol)) {
          const image = document.createElement('img');
          image.alt = a.image_alt || a.ja_title || title(a);
          image.onerror = () => image.replaceWith(element('p', '画像を読み込めませんでした。'));
          image.src = url.href;
          $('#visual').append(image);
        }
      } catch { /* 本文は画像の有無にかかわらず表示する。 */ }
    }
    $('#vocab').replaceChildren(...a.vocab.map(([word, meaning, example]) => {
      const row = document.createElement('tr');
      const detail = element('td', meaning);
      if (example) detail.append(element('p', example));
      row.append(element('td', word), detail);
      return row;
    }));
  }

  function render() {
    const query = $('#search').value.trim().toLowerCase();
    const category = $('#category').value;
    const level = $('#level').value;
    const visible = articles.filter(a =>
      (!category || category === a.category) && (!level || level === (slot(a) || 'legacy')) &&
      (!query || [a.title, a.ja_title, a.en, a.ja, ...a.vocab.flat()].join(' ').toLowerCase().includes(query))
    );
    if (!visible.includes(selected)) selected = visible[0];
    $('#count').textContent = visible.length + ' 件の記事';
    $('#list').replaceChildren(...visible.map(a => {
      const button = element('button', '');
      button.className = 'story';
      button.setAttribute('aria-current', String(selected === a));
      const meta = element('span', [a.is_preview && 'サンプル', a.date, slot(a), grades[slot(a)], a.category].filter(Boolean).join(' · '));
      meta.className = 'small';
      button.append(meta, element('strong', title(a)));
      button.onclick = () => {
        selected = a;
        const previous = $('.story[aria-current="true"]');
        if (previous) previous.setAttribute('aria-current', 'false');
        button.setAttribute('aria-current', 'true');
        displayArticle(a);
      };
      return button;
    }));
    $('article').hidden = !selected;
    if (selected) displayArticle(selected);
  }

  function setArticles(rows) {
    articles = rows.sort((a, b) => Number(!!a.is_preview) - Number(!!b.is_preview)
      || b.date.localeCompare(a.date) || slot(b).localeCompare(slot(a)));
    const category = $('#category').value;
    const names = [...new Set(articles.map(a => a.category))];
    $('#category').replaceChildren(new Option('すべて', ''), ...names.map(name => new Option(name, name)));
    $('#category').value = category;
    render();
  }

  function valid(a) {
    return a && ['date', 'category', 'title', 'en', 'ja'].every(k => typeof a[k] === 'string' && a[k].trim())
      && /^\d{4}-\d\d-\d\d$/.test(a.date) && Array.isArray(a.vocab)
      && a.vocab.every(v => Array.isArray(v) && v.length >= 2 && v.every(x => typeof x === 'string'));
  }

  $('#search').oninput = render;
  $('#category').onchange = $('#level').onchange = render;
  for (const button of document.querySelectorAll('[data-mode]')) {
    button.onclick = () => {
      const mode = button.dataset.mode;
      $('#english').hidden = mode === 'ja';
      $('#japanese').hidden = mode === 'en';
      for (const b of document.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b === button));
    };
  }
  $('#upload').onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      const rows = Array.isArray(raw) ? raw : (raw?.articles ?? [raw]);
      if (!Array.isArray(rows) || !rows.length || !rows.every(valid)) throw Error('記事形式を確認してください。');
      const byKey = new Map(articles.map(a => [key(a), a]));
      for (const a of rows) byKey.set(key(a), a);
      selected = byKey.get(key(rows[0]));
      $('#search').value = $('#category').value = $('#level').value = '';
      setArticles([...byKey.values()]);
      $('#status').textContent = rows.length + ' 件を読み込みました。';
    } catch (error) {
      $('#status').textContent = '読み込み失敗：' + error.message;
    }
    event.target.value = '';
  };
  $('#export').onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(articles, null, 2)], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'daily_english_articles.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  async function load() {
    try {
      const response = await fetch('./daily_english_articles.json', { cache: 'no-cache' });
      if (!response.ok) throw Error('HTTP ' + response.status);
      const rows = await response.json();
      if (!Array.isArray(rows) || !rows.every(valid)) throw Error('記事JSONの形式が不正です。');
      setArticles(rows);
      $('#upload').disabled = $('#export').disabled = false;
    } catch (error) {
      $('#count').textContent = '記事を読み込めませんでした。' + error.message;
    }
  }
  load();
</script>
</body>
</html>
