d look at what we are buying.\n\nFor example, two bags may look similar but contain different amounts of fruit. One bag may hold small apples, while another holds large ones. Some fruit may need to be eaten today. Comparing only the number on the sign can hide these differences.\n\nThe shopkeeper also has costs. She pays for the fruit, the space, and the trip to the farm. Selling a bag for four hundred yen does not mean she earns four hundred yen. Part of the money must pay for those costs.\n\nKen starts to see the market differently. It is more than a place where people exchange money and food. Farmers, drivers, sellers, and customers all make choices. A change at one farm can affect a family deciding what to bake.\n\nThat afternoon, Ken and his mother make their pear cake. It tastes different from the apple pie they planned, but everyone enjoys it. They write the new recipe in a notebook so they can make it again.\n\nThe next time Ken visits the market, he checks the prices and asks about the fruit. He does not expect every price change to have one simple cause. Still, he knows where to begin: notice what changed, compare the choices, and ask a clear question. A small shopping trip can teach us a lot about how an economy works.","ja":"土曜の朝、ケンは母と小さな市場に行きます。パイ用のリンゴを買いたいのです。先週は一袋300円でしたが、今日は同じ種類の袋が400円です。なぜ値段が変わったのか不思議に思います。\n\n店の人によると、今週は届いたリンゴが少なかったそうです。近くの農園で強風が果物の一部を傷つけました。リンゴを欲しいお客さんは多いままですが、売れる袋は減っています。この架空の市場では、それが値上がりの理由の一つです。\n\nケンは別の台を見ます。洋ナシがたくさん並び、今日はリンゴより安く売られています。母が「代わりに洋ナシのケーキを作れないかな」と尋ねます。ケンは食べたことがありませんが、よい考えだと思い、予定を変えます。\n\n値段は情報を伝えてくれます。高い値段は、手に入りにくくなったことを示すかもしれません。安い値段は、違う選択肢を試すきっかけになります。しかし、値段ですべてが分かるわけではありません。質問し、買う物をよく見る必要があります。\n\n例えば、似た袋でも果物の量が違うかもしれません。一方には小さいリンゴ、もう一方には大きいリンゴが入っていることもあります。今日中に食べる必要がある果物もあるでしょう。表示の数字だけでは、こうした違いを見落とします。\n\n店の人にも費用がかかります。果物、売り場、農園への移動にお金を払います。400円で一袋売っても、400円がもうけになるわけではありません。一部はその費用に充てます。\n\nケンは市場を違った目で見始めます。お金と食べ物を交換するだけの場所ではありません。農家、運転手、店の人、お客さんがそれぞれ選択しています。一つの農園で起きた変化が、何を焼くか考える家族に影響することもあります。\n\n午後、ケンと母は洋ナシのケーキを作ります。予定していたアップルパイとは違いますが、みんながおいしく食べました。また作れるよう、新しいレシピをノートに書きます。\n\n次に市場に来たとき、ケンは値段を確かめ、果物について尋ねます。どの値段の変化にも単純な原因が一つだけあるとは思いません。それでも、変化に気づき、選択肢を比べ、分かりやすく質問するところから始められます。小さな買い物でも、経済の仕組みをたくさん学べるのです。","vocab":[["arrive","届く・到着する","Fewer apples arrived this week."],["instead","代わりに","We bought pears instead."],["amount","量","Check the amount of fruit in the bag."],["cost","費用","The seller must pay several costs."],["affect","影響する","Bad weather can affect a farm."]],"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-07-0700.jpg","image_alt":"市場でリンゴと洋ナシを見比べる親子","image_prompt":"市場でリンゴと洋ナシを見比べる親子。横長、落ち着いた編集イラスト、文字・ロゴなし。"},{"date":"2026-11-07","category":"投資・経済","title":"[12:00] The Tool We Only Need Once","ja_title":"一度しか使わない道具","is_preview":false,"en":"Mina wants to put a small shelf in her room. She needs a tool for the job, but she does not own one. At the shop, she finds several models with different prices. Before choosing the cheapest, she asks herself a different question: does she need to own this tool at all?\n\nSuppose a nearby community center lends tools to residents. Mina could borrow the one she needs for a weekend. In this imagined example, borrowing costs much less than buying. It also means she will not need to find space for the tool after the shelf is finished.\n\nHowever, borrowing is not completely free of effort. Mina must check whether the tool is available, collect it during opening hours, and return it on time. If the center is far away, the journeys may take longer than the job itself. The lowest money cost is not always the easiest choice.\n\nBuying has advantages too. If Mina expects to make furniture regularly, having her own tool could be convenient. She could use it whenever she has time and become familiar with how it works. A purchase that seems unnecessary for one project may make sense for many projects.\n\nThere is also another possibility: asking someone who already owns the tool to help. A neighbor might enjoy showing her how to use it correctly. Mina should still agree on a suitable time and treat the tool with care. Sharing works better when people respect each other's time and property.\n\nThis decision is an example of looking beyond the price tag. The full cost of a choice can include storage, travel, learning, and maintenance. The benefits can include convenience, independence, and the chance to develop a skill. Different people may reasonably choose different options.\n\nMina writes down three questions. How often will I use it? Where will I keep it? What will I do if it breaks? She does not need perfect answers, but the questions help her avoid buying something simply because it is on sale.\n\nIn the end, she borrows a tool for her first project. If she discovers that she enjoys making things, she can consider buying one later. Trying a small project gives her information about her actual needs.\n\nThe finished shelf holds several books and a plant. The tool has gone back to the community center, ready for another person. Mina has gained more than a shelf. She has learned that access to something can sometimes be more useful than ownership.","ja":"ミナは部屋に小さな棚を取り付けたいと思っています。作業に必要な道具を持っていません。店では値段の違う数種類が見つかります。最も安い物を選ぶ前に、そもそも自分で所有する必要があるのかと考えます。\n\n近所の地域センターが住民に道具を貸しているとします。ミナは週末に借りられるかもしれません。この架空の例では、借りる方が買うよりずっと安く済みます。棚が完成した後の保管場所も不要です。\n\nただし、借りることにも手間はかかります。貸し出し可能か確認し、開館時間内に受け取り、期限までに返す必要があります。遠ければ、作業そのものより往復に時間がかかるかもしれません。金額が最小の選択が、最も楽とは限りません。\n\n買うことにも利点があります。定期的に家具を作るなら、自分の道具があると便利でしょう。時間があるときに使え、使い方にも慣れます。一度の作業には不要に思える購入も、多くの作業には意味があるかもしれません。\n\nすでに道具を持っている人に手伝ってもらう方法もあります。近所の人が正しい使い方を喜んで教えてくれるかもしれません。その場合も都合のよい時間を決め、道具を大切に扱うべきです。お互いの時間や持ち物を尊重すると、共有はうまくいきます。\n\nこの判断は、値札の先まで考える例です。選択にかかる費用全体には、保管、移動、習得、手入れも含まれます。利点には、便利さ、自分でできること、技能を身につける機会があります。人によって違う選択をしても不合理ではありません。\n\nミナは三つの質問を書きます。どのくらい使うか。どこにしまうか。壊れたらどうするか。完璧な答えは要りませんが、安売りというだけで買うのを避ける助けになります。\n\n結局、最初の作業には借りることにします。物作りを楽しめると分かったら、後で買うことを考えられます。小さく試すことで、実際に必要なものが見えてきます。\n\n完成した棚には数冊の本と植物が置かれました。道具はセンターに戻り、次の人を待っています。ミナが得たのは棚だけではありません。使えることが、持っていることより役立つ場合もあると学んだのです。","vocab":[["own","所有する","She does not own a tool."],["available","利用できる","Is the tool available this weekend?"],["on time","期限どおりに","Return the tool on time."],["price tag","値札","Look beyond the price tag."],["ownership","所有","Access may matter more than ownership."]],"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-07-1200.jpg","image_alt":"地域センターで道具を借りる女性","image_prompt":"地域センターで道具を借りる女性。横長、落ち着いた編集イラスト、文字・ロゴなし。"},{"date":"2026-11-07","category":"投資・経済","title":"[17:00] The Invisible Cost of an Empty Seat","ja_title":"空席に隠れた費用","is_preview":false,"en":"Imagine a small town offering a free workshop on repairing bicycles. Twenty places are available, and all are reserved within a day. The organizer prepares tools and asks two volunteers to help. On Saturday, however, only twelve people arrive. Several others wanted to attend but were told the workshop was full.\n\nNo ticket money has been lost, so it may seem that the empty seats do not matter. Yet the workshop has used time, space, and materials. More importantly, the eight unused reservations prevented other people from taking part. A price of zero does not mean that an activity has no cost.\n\nEconomists use the idea of opportunity cost to describe the value of the best alternative we give up when making a choice. In this example, holding an unused place can mean giving up the opportunity for another resident to learn a useful skill. The loss is real even when it does not appear on a receipt.\n\nCharging a fee might reduce casual reservations, but it would create another problem. Some residents who would benefit from the workshop might be unable or unwilling to pay. The organizer wants people to take their reservations seriously without making participation unnecessarily difficult.\n\nOne possible approach is a clear cancellation process. A reminder sent before the event could include a simple way to release a place. A waiting list could then offer that place to someone else. These changes would not guarantee full attendance, but they could make better use of limited space.\n\nThe organizer should also avoid assuming that everyone who misses the workshop is careless. People can become ill, face transport problems, or have unexpected responsibilities. A useful system makes room for these situations while helping participants communicate changes.\n\nThis example shows why economic decisions involve more than collecting money. Rules influence behavior, and every rule can create advantages and disadvantages. A strict policy may reduce empty seats but discourage people from signing up. A very flexible policy may welcome more people while leaving the organizer uncertain about numbers.\n\nAfter the workshop, the organizer reviews the attendance and asks participants about the booking process. Rather than introducing several new rules at once, she decides to test reminders and easier cancellations at the next event.\n\nThe aim is not to punish people for changing their plans. It is to connect an available place with someone who can use it. When resources are limited, a small improvement in coordination can create value without buying anything new. Sometimes the most important cost is the useful activity that never happened.","ja":"小さな町が、自転車修理の無料講習会を開くとします。定員20人は一日で予約が埋まりました。主催者は道具を用意し、ボランティア二人に協力を頼みます。しかし土曜日に来たのは12人だけでした。参加したかったのに満員と告げられた人も何人かいました。\n\n入場料の収入を失ったわけではないので、空席は問題ないように思えるかもしれません。しかし、講習会には時間、場所、材料が使われています。さらに、使われなかった8人分の予約が、ほかの人の参加を妨げました。価格がゼロでも、活動に費用がないわけではありません。\n\n経済学では、ある選択のために諦める最善の代替案の価値を「機会費用」と呼びます。この例では、使わない席を確保し続けることで、ほかの住民が技能を学ぶ機会が失われます。領収書に現れなくても、その損失は存在します。\n\n料金を取れば気軽な予約は減るかもしれませんが、別の問題が生じます。講習会が役立つ住民の中には、支払えない人や支払いたくない人もいるでしょう。主催者は、参加を必要以上に難しくせず、予約を大切にしてもらいたいのです。\n\n方法の一つは、分かりやすいキャンセル手続きです。開催前の通知に、簡単に席を返せる手段を含められます。キャンセル待ちの人に、その席を案内できるでしょう。全員出席は保証できなくても、限られた場所をより有効に使えるかもしれません。\n\n欠席者全員が無責任だと決めつけるべきでもありません。体調を崩したり、交通の問題や急な用事が生じたりします。役立つ仕組みはそうした事情を受け止めつつ、変更を連絡しやすくします。\n\nこの例は、経済的な判断が集金だけの話ではないことを示します。ルールは行動に影響し、それぞれに利点と欠点が生まれます。厳しい方針は空席を減らしても申し込みをためらわせるかもしれません。柔軟な方針は参加を歓迎する一方で、主催者が人数を予測しにくくなります。\n\n講習会の後、主催者は出席状況を振り返り、予約手続きについて参加者に尋ねます。複数のルールを一度に導入せず、次回は事前通知と簡単なキャンセルを試すことにしました。\n\n目的は予定が変わった人を罰することではありません。空いている席を使える人につなぐことです。資源が限られているとき、連絡や調整を少し改善すれば、新しく何も買わずに価値を生み出せます。最も重要な費用が、実現しなかった有益な活動である場合もあるのです。","vocab":[["reserve","予約する","Twenty people reserved places."],["opportunity cost","機会費用","An unused place can have an opportunity cost."],["release","手放す・空ける","Please release your place if you cannot attend."],["participation","参加","The fee may discourage participation."],["coordination","連絡・調整","Better coordination can reduce empty seats."]],"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-07-1700.jpg","image_alt":"自転車修理講習会の空席と準備された道具","image_prompt":"自転車修理講習会の空席と準備された道具。横長、落ち着いた編集イラスト、文字・ロゴなし。"},{"date":"2026-11-08","category":"米国ベストセラー書籍","title":"[07:00] Two Friends, Two Ways to Think About Money","ja_title":"二人の友人、お金についての二つの考え方","is_preview":false,"en":"Why do two people make different choices with the same amount of money? One person buys something today. Another keeps the money for later. It is easy to think that one person is right and the other is wrong. A book can help us ask a better question.\n\nThe Psychology of Money is a book by Morgan Housel. It explores how people think and behave when they make decisions about money. The book uses short stories to discuss these ideas. Here is a separate, imaginary example that we can use to think about the subject.\n\nYuki and Tom each receive three thousand yen for helping at a family event. Yuki wants to buy a train ticket and visit a friend in another town. Tom wants to keep his money in an envelope. They are surprised by each other's plans.\n\n\"Why not enjoy the money?\" Yuki asks. Tom says he is saving for a bicycle. He likes watching the amount in his envelope grow. To him, keeping the money is not doing nothing. It is moving closer to something he wants.\n\nYuki explains her choice too. Her friend will soon move far away, so this may be their last chance to meet for a while. The train ride is not simply a way to spend money. It gives her time with someone important.\n\nNeither friend could understand the other's choice by looking only at the amount of money. They needed to hear about the purpose behind it. Their different plans began to make sense when they shared more of their stories.\n\nThis does not mean that every purchase is a good idea. We still need to know what something costs and whether we can pay for it. But numbers alone do not tell us what a choice means to the person making it.\n\nWhen you read a book about money, you do not have to copy every example. You can pause and ask how an idea connects with your own life. What do you want your money to help you do? Which choices make you feel satisfied later, not only at the moment?\n\nYuki buys her train ticket, and Tom adds his money to the envelope. They still choose different things, but they no longer think the difference is strange. A useful book does not always give everyone the same answer. Sometimes it teaches us to listen more carefully and to understand the question before we try to answer it.","ja":"同じ金額を持つ二人が、なぜ違う選択をするのでしょう。一人は今日何かを買い、もう一人は後のために残します。一方が正しく、他方が間違いだと考えるのは簡単です。本は、もっとよい問いを考える助けになります。\n\n『The Psychology of Money（サイコロジー・オブ・マネー）』はモーガン・ハウセルの本です。お金の判断をするときの考え方や行動を探り、短い物語を使って論じています。ここからは、そのテーマを考えるための、本とは別の架空の例です。\n\nユキとトムは、家族の行事を手伝い、それぞれ3000円をもらいました。ユキは電車の切符を買って別の町の友人に会いたいと思っています。トムは封筒にお金を残したいと思っています。二人は互いの予定に驚きます。\n\n「どうしてお金を使って楽しもうとしないの」とユキが尋ねます。トムは自転車のためにためていると答えます。封筒の中の金額が増えるのを見るのが好きなのです。彼にとって、お金を残すのは何もしないことではありません。欲しい物に近づくことです。\n\nユキも自分の選択を説明します。友人はもうすぐ遠くに引っ越すので、しばらく会えなくなる前の最後の機会かもしれません。電車に乗るのは、単にお金を使うことではありません。大切な人と過ごす時間を得ることです。\n\n金額だけを見ても、二人は相手の選択を理解できませんでした。背後にある目的を聞く必要がありました。事情を話すと、違う計画にも納得できるようになりました。\n\nこれは、どんな買い物もよいという意味ではありません。値段と、支払えるかどうかは確認する必要があります。しかし、数字だけでは、選んだ本人にとっての意味までは分かりません。\n\nお金の本を読むとき、すべての例をまねする必要はありません。立ち止まり、その考えが自分の生活とどうつながるか考えられます。お金に何を助けてほしいでしょうか。その瞬間だけでなく、後でも満足できるのはどんな選択でしょうか。\n\nユキは切符を買い、トムは封筒にお金を足します。選んだものは違うままですが、その違いを変だとは思わなくなりました。役立つ本は、いつも全員に同じ答えを与えるわけではありません。丁寧に耳を傾け、答える前に問いを理解することを教えてくれる場合もあります。","vocab":[["amount","金額・量","They received the same amount of money."],["save for","～のために貯める","Tom is saving for a bicycle."],["purpose","目的","Ask about the purpose of the choice."],["make sense","納得できる・意味が分かる","Her plan began to make sense."],["satisfied","満足している","I felt satisfied with my choice."]],"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-08-0700.jpg","image_alt":"電車の切符と貯金用の封筒について話す二人の友人","image_prompt":"電車の切符と貯金用の封筒について話す二人の友人。横長、落ち着いた編集イラスト、文字・ロゴなし。"},{"date":"2026-11-09","category":"文化・社会","title":"[07:00] A Small Repair, a New Friend","ja_title":"小さな修理から生まれる新しい友達","en":"On Saturday morning, Emma sees a small table near the door of her town's community center. There are three cups, an old clock, and a blue bag on it. A sign says, \"Bring something broken. Let's try to fix it together.\" Emma thinks about a red scarf at home. It has a small hole, but she still loves it.\n\nThe next week, she brings the scarf to the center. An older man named Ben welcomes her. He does not take the scarf and work alone. Instead, he asks her to sit beside him. He shows her how to hold a needle and choose some thread. Emma moves slowly because she has never done this before. Ben tells her that there is no need to hurry.\n\nAt another table, a boy and his father are looking at a toy car. One wheel has come off. A woman helps them find a way to put it back. Nearby, two neighbors are talking about a chair with a weak leg. The room is full of small problems, but it is also full of questions and friendly voices.\n\nAfter half an hour, Emma's scarf is ready. The new thread is yellow, so she can still see the place where the hole was. At first, she wishes the color were the same. Then she smiles. The yellow lines remind her of the morning and the person who helped her.\n\nBefore she leaves, Ben asks if she would like to come again. \"But I can't fix many things,\" she says. \"You can welcome people or make tea,\" he answers. \"Everyone has something to offer.\" Emma decides to help at the door next month.\n\nThis story shows a simple way for people to spend time together. Fixing an old object can save it from the rubbish bin. It can also give people a reason to meet. A person who feels shy may find it easier to talk while doing something with their hands.\n\nWe do not have to be experts to begin learning a useful skill. We can ask a question, watch carefully, and try one small step. When we share what we know, an ordinary room can become a place where people feel welcome. Emma brings home more than a scarf. She brings home a new skill and the feeling that she belongs.","ja":"土曜日の朝、エマは町のコミュニティーセンターの入口近くに小さなテーブルを見つけます。その上にはカップが3個、古い時計、青いバッグがあります。看板には「壊れたものを持ってきてください。一緒に直してみましょう」と書いてあります。エマは家にある赤いマフラーを思い浮かべます。小さな穴が開いていますが、今でも大好きなのです。\n\n翌週、彼女はそのマフラーをセンターに持っていきます。ベンという年配の男性が迎えてくれます。彼はマフラーを受け取って一人で作業するのではありません。代わりに、隣に座るように彼女に言います。針の持ち方と糸の選び方を教えてくれます。エマは初めてなので、ゆっくり手を動かします。ベンは急ぐ必要はないと言ってくれます。\n\n別のテーブルでは、男の子と父親がおもちゃの車を見ています。車輪が一つ外れてしまったのです。女性が、それを元に戻す方法を探すのを手伝っています。近くでは、近所の人が二人、脚がぐらつく椅子について話しています。部屋には小さな問題がたくさんありますが、質問や親しみのこもった声もあふれています。\n\n30分後、エマのマフラーは直りました。新しい糸は黄色なので、穴があった場所はまだ分かります。最初、彼女は同じ色だったらよかったのにと思います。それから笑顔になります。黄色い縫い目を見ると、この朝のことや手伝ってくれた人を思い出すのです。\n\n帰る前に、ベンはまた来たいかと尋ねます。「でも、私はあまりいろいろなものを直せません」と彼女は言います。「来た人を迎えたり、お茶をいれたりできますよ」と彼は答えます。「誰にでも役立てられるものがあります。」エマは来月、入口で手伝うことにします。\n\nこの物語は、人々が一緒に時間を過ごす簡単な方法を示しています。古いものを直せば、ごみ箱行きを防げるかもしれません。また、人が出会うきっかけにもなります。人見知りする人も、手を動かして何かをしながらなら、話しやすく感じるかもしれません。\n\n役立つ技術を学び始めるのに、専門家である必要はありません。質問をし、よく見て、小さな一歩を試すことができます。知っていることを分かち合えば、普通の部屋も、人々が歓迎されていると感じる場所になります。エマが持ち帰るのはマフラーだけではありません。新しい技術と、自分の居場所があるという気持ちも持ち帰るのです。","vocab":[["fix","修理する、直す","Can you help me fix this chair?"],["beside","〜の隣に","Please sit beside me."],["come off","外れる","One wheel has come off the toy car."],["remind A of B","AにBを思い出させる","This scarf reminds me of my friend."],["belong","居場所がある、仲間の一員である","I feel that I belong here."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-09-0700.jpg","image_alt":"地域の修理会で赤いマフラーを黄色い糸で繕う女性と見守る男性","image_prompt":"Use case: illustration-story. Wide 16:9 editorial illustration for an English learning essay. In a welcoming community repair gathering, a young woman learns to mend a red scarf using yellow thread, sitting beside a kind elderly man at a wooden table. Close foreground view of the scarf and careful hands, with the two people's relaxed faces visible; softly suggested neighbors repairing a toy car behind them. Warm morning window light, muted cream and sage colors, subtle watercolor and pencil texture, calm and thoughtful rather than childish. No text, no lettering, no logos, no watermark."},{"date":"2026-11-09","category":"文化・社会","title":"[12:00] The Stories Behind an Ordinary Street","ja_title":"いつもの通りに隠れた物語","en":"When Maya moves to a new town, she enjoys exploring its streets but finds it difficult to remember their names. One afternoon, she notices a black-and-white photograph in a bakery window. It shows the same street many years earlier. There are fewer cars, and a large tree stands where a bus stop is today. She goes inside to ask about it.\n\nThe baker explains that his mother took the photograph. She used to walk along that street on her way to school. Maya asks whether she can hear more about the picture. The baker suggests that she visit a small exhibition at the local community hall. Residents have brought photographs and written short notes about them.\n\nAt the exhibition, Maya sees pictures of ordinary life: a family eating lunch, children playing beside a river, and people waiting outside a cinema. These are not famous historical events. Yet each picture contains details that help her imagine how the town once felt. She recognizes a bridge, although the shops around it have changed completely.\n\nAn older visitor tells Maya that the river used to flood after heavy rain. Another person remembers buying sweets near the bridge. Their memories are different, and they sometimes disagree about dates. A volunteer writes down both stories instead of choosing one immediately. She explains that memories can be valuable even when some details need to be checked.\n\nMaya begins to understand why local history matters. A street is more than a route between home and work. It holds experiences that belong to many people. Learning about those experiences can make an unfamiliar place feel closer. It can also encourage newcomers to ask questions and longtime residents to share what they know.\n\nHowever, the exhibition makes Maya notice what is missing. Most photographs come from families who have lived there for decades. What about people who arrived recently, or those who never owned a camera? The volunteer agrees that one collection cannot tell every story. She invites visitors to suggest other voices to include.\n\nBefore leaving, Maya photographs the community hall with permission. She writes a few sentences about her first month in town. Her picture does not look old or important, but she gives a copy to the volunteer.\n\nHistory is not only something we receive from the past. The ordinary things we record today may help someone understand our lives tomorrow. Maya still forgets street names, but she no longer feels that she is walking through a place without stories.","ja":"マヤは新しい町に引っ越すと、通りを歩いて探検するのを楽しみますが、通りの名前を覚えるのは難しいと感じています。ある午後、パン屋の窓に飾られた白黒写真に気づきます。それは何年も前の同じ通りを写したものです。車は今より少なく、現在バス停がある場所には大きな木が立っています。彼女は写真について尋ねるため、店に入ります。\n\nパン屋の店主は、自分の母親が撮った写真だと説明します。母親は学校に通う途中、よくその通りを歩いていたそうです。マヤは写真についてもっと話を聞けるか尋ねます。店主は地域の集会所で開かれている小さな展示会を訪ねるよう勧めます。住民たちが写真を持ち寄り、それぞれについて短い説明を書いているのです。\n\n展示会でマヤが見るのは、昼食を食べる家族、川のそばで遊ぶ子どもたち、映画館の外で待つ人々など、日常生活の写真です。有名な歴史的事件ではありません。それでも、どの写真にも、かつての町の雰囲気を想像する手がかりになる細部があります。周りの店はすっかり変わっていますが、見覚えのある橋にも気づきます。\n\n年配の来場者がマヤに、その川は以前、大雨の後によく氾濫したと話します。別の人は橋の近くでお菓子を買ったことを覚えています。二人の記憶は異なり、時期について意見が合わないこともあります。ボランティアはすぐにどちらかを選ぶのではなく、両方の話を書き留めます。一部の細部を確かめる必要があっても、記憶には価値があると説明します。\n\nマヤは地域の歴史が大切な理由を理解し始めます。通りは、家と職場を結ぶ経路以上のものです。そこには多くの人々の経験が刻まれています。その経験を知ることで、なじみのない場所をより身近に感じられるようになります。また、新しく来た人が質問し、長く暮らしてきた住民が知っていることを伝えるきっかけにもなります。\n\nしかし、この展示会を見て、マヤは欠けているものにも気づきます。写真の大半は、何十年もそこに暮らしてきた家族から提供されています。最近引っ越してきた人や、カメラを一度も持ったことのない人はどうでしょうか。ボランティアも、一つの収集資料だけではすべての物語を伝えられないと認めます。そして、ほかにどんな人の声を加えるとよいか、来場者に提案を求めます。\n\n帰る前に、マヤは許可を得て集会所の写真を撮ります。町で過ごした最初の1か月について、数文を書きます。その写真は古くも重要にも見えませんが、彼女はその写しをボランティアに渡します。\n\n歴史は、過去から受け取るだけのものではありません。今日記録するありふれたことが、明日、誰かが私たちの生活を理解する助けになるかもしれません。マヤは今でも通りの名前を忘れますが、物語のない場所を歩いているとは、もう感じません。","vocab":[["used to","以前はよく〜した","She used to walk along this street."],["write down","書き留める","The volunteer writes down both stories."],["unfamiliar","なじみのない","The town was unfamiliar to Maya."],["with permission","許可を得て","She took the photograph with permission."],["a sense of history","歴史を感じる感覚","Old photographs give us a sense of history."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-09-1200.jpg","image_alt":"地域の写真展で古い町並みの写真を見ながら話す人々","image_prompt":"Wide 16:9 calm editorial watercolor and colored pencil illustration, no text or logos. A small local history photo exhibition inside a modest community hall. Wide view from behind a young adult woman looking at a wall of black-and-white photographs showing an old bridge, a street with a tree, and ordinary town life. An older visitor gestures gently toward a photograph, a volunteer holds a notebook nearby. Soft midday window light, cream paper texture, muted sage, blue and ochre, reflective welcoming atmosphere. Photos have no readable captions. Distinct spacious gallery composition, not a close-up of hands."},{"date":"2026-11-09","category":"文化・社会","title":"[17:00] A Park for Different Needs","ja_title":"異なる願いを受け止める公園","en":"Imagine a small neighborhood park with one empty corner. Some residents want a basketball court, while others would prefer a quiet garden. At a public meeting, the first speaker describes the excitement of playing sport after school. The next speaker explains how much she values a peaceful place to read. Both care about the park, but they seem to want opposite things.\n\nIt would be easy to turn this discussion into a contest. Each group could collect supporters and try to defeat the other. However, winning a vote would not necessarily make everyone feel welcome in the finished park. Before choosing a plan, the meeting leader asks a different question: \"What do you need this space to help you do?\"\n\nThe answers reveal more than the original requests. Teenagers want somewhere nearby to spend time with friends without paying. Older residents want comfortable seats and a place where conversation is possible. A parent hopes to watch a child play while resting. The court and the garden are possible solutions, but the needs behind them are broader.\n\nThis change in the conversation does not remove every disagreement. A bouncing ball still makes noise, and the available space remains small. Yet the residents can now consider more options. They discuss a modest play area, benches away from it, and clear hours for noisy activities. They also decide to check whether paths would be easy to use with a wheelchair or a pushchair.\n\nOne participant has said nothing. When the leader invites written comments, he explains that he works at night and sleeps during the day. His concern was missing from the discussion, not because it was unimportant, but because he was uncomfortable speaking to a crowd. A fair process needs more than an open door; people also need practical ways to be heard.\n\nThe residents agree to test a temporary arrangement before spending money on permanent changes. During the trial, they will observe how the space is used and ask visitors what works. If problems appear, changing the plan will be a sign of learning rather than failure.\n\nThis imagined meeting offers a useful lesson for everyday disagreements. Listening does not require us to accept every suggestion. It asks us to understand the reason behind a request before judging it. When we separate people's needs from their first proposed solutions, we may discover choices that were invisible at the beginning. Shared places become better when the people who use them help shape the decisions.","ja":"一角が空いている、近所の小さな公園を想像してください。バスケットボールコートを望む住民もいれば、静かな庭を好む住民もいます。住民向けの話し合いで、最初の発言者は放課後にスポーツをする楽しさを語ります。次の発言者は、落ち着いて本を読める場所をどれほど大切にしているか説明します。二人とも公園を大切に思っていますが、正反対のものを求めているように見えます。\n\nこの話し合いを勝ち負けの争いに変えるのは簡単でしょう。それぞれのグループが支持者を集め、相手を負かそうとすることもできます。しかし、投票で勝っても、完成した公園で誰もが歓迎されていると感じるとは限りません。計画を選ぶ前に、司会者は別の質問をします。「この場所で、どんなことができるようになってほしいですか。」\n\n答えからは、最初の要望以上のことが見えてきます。十代の若者たちは、お金を払わず友達と過ごせる近場の場所を求めています。年配の住民は座り心地のよいベンチと、会話ができる場所を求めています。ある親は、休みながら子どもの遊ぶ様子を見守りたいと思っています。コートや庭は解決策の候補ですが、その背後にある必要や願いは、もっと幅広いものなのです。\n\n会話のこの変化によって、意見の相違がすべてなくなるわけではありません。ボールが弾む音は依然として出ますし、使える場所も狭いままです。それでも住民たちは、より多くの選択肢を検討できるようになります。小規模な遊び場、そこから離れたベンチ、音の出る活動を行う時間の明確な設定について話し合います。また、車いすやベビーカーで通路を使いやすいか確認することにします。\n\n参加者の一人は何も発言していません。司会者が書面での意見も受け付けると伝えると、彼は夜に働き、昼間に眠っていると説明します。その心配事が話し合いに出ていなかったのは、重要でなかったからではなく、大勢の前で話すことが苦手だったからです。公平な手続きには、参加の扉を開くだけでは足りません。人々には、実際に意見を聞いてもらえる方法も必要です。\n\n住民たちは、恒久的な改修にお金を使う前に、仮の配置を試すことに同意します。試行期間中は、場所がどのように使われているか観察し、利用者に何がうまくいっているか尋ねます。問題が現れた場合、計画を変えることは失敗ではなく、学んでいる証しになるでしょう。\n\nこの架空の会合は、日常の意見の対立にも役立つ教訓を示しています。耳を傾けることは、すべての提案を受け入れることを意味しません。判断する前に、要望の背後にある理由を理解することです。人々の必要や願いを、最初に提案された解決策と分けて考えると、初めには見えなかった選択肢が見つかるかもしれません。共有の場所は、利用する人々が意思決定に関わることで、よりよいものになります。","vocab":[["not necessarily","必ずしも〜とは限らない","Winning a vote does not necessarily solve a problem."],["behind a request","要望の背後にある","Try to understand the reason behind a request."],["be heard","意見を聞いてもらう","Everyone needs a practical way to be heard."],["temporary arrangement","仮の配置・暫定的な取り決め","They tested a temporary arrangement in the park."],["rather than","〜ではなく","Changing the plan was a sign of learning rather than failure."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-09-1700.jpg","image_alt":"公園の模型を囲み、さまざまな住民が利用方法を話し合う様子","image_prompt":"Wide 16:9 calm editorial watercolor and pencil illustration, no text, no lettering, no logos. Elevated three-quarter outdoor view of a small neighborhood park in warm late-afternoon light. A diverse small group of residents, including teenagers with a basketball, an older woman, a parent with a pushchair and a wheelchair user, gather around a simple tabletop model of their park, listening to each other. The park behind them contains a modest play area, a curving accessible path and quiet benches beside planting. The foreground model is simple shapes without words. Thoughtful cooperative mood, muted sage green, ochre and cream paper texture. Spacious outdoor composition distinct from indoor repair workshops or photo exhibitions."},{"date":"2026-11-10","category":"AI・テクノロジー","title":"[07:00] Words That Help Everyone Watch","ja_title":"みんなが動画を楽しむための言葉","en":"Leo wants to make a short video about his school garden. He films the flowers, the small trees, and his friend Anna watering the plants. Then he records his voice. He explains when the class planted the seeds and how the garden changed. He is happy with the pictures, but his sister notices a problem.\n\n\"I can't listen to this on the bus,\" she says. \"Can you add words at the bottom?\" Leo has seen these words in other videos. They are called captions. They show what a person is saying. He opens a video program and finds a tool that can make captions from his voice.\n\nIn a few minutes, words appear under the pictures. Leo is excited. He does not have to type every sentence himself. However, when he watches the video again, he laughs. He said \"three green trees,\" but the program wrote \"three green trains.\" There are no trains in the school garden.\n\nAnna helps him check the rest. They listen to one short part at a time and read the words on the screen. Some words are correct, but others need small changes. When a dog barks near Leo, one sentence is hard to hear. They listen again and fix the caption together.\n\nNext, they check the size of the letters. The first captions are too small on Anna's phone. Leo makes them larger. He also moves them so they do not cover the flowers. A useful caption must be easy to read, not just correct. They leave each sentence on the screen long enough for a reader to finish it.\n\nBefore sharing the video, Leo watches it with the sound off. Can he still understand the story? He finds one more problem. Anna speaks in one part, but the captions do not show who is talking. He adds her name to that part.\n\nThis simple project teaches Leo something about technology. A tool can help him start quickly, but he still needs to check its work. He also needs to think about the people who will watch his video. Some may not hear the sound clearly. Others may be in a quiet place where they cannot play it aloud.\n\nThe next day, his sister watches the new video on the bus. She sends him a message: \"Now I understand the whole story.\" Leo smiles. Adding a few lines of words has helped him share his garden with more people.","ja":"レオは学校の庭について短い動画を作りたいと思っています。花や小さな木、友達のアンナが植物に水をやる様子を撮影します。それから自分の声を録音します。クラスでいつ種を植え、庭がどのように変わったかを説明します。映像には満足していますが、姉が一つ問題に気づきます。\n\n「バスの中ではこれを音声で聞けないの」と姉は言います。「下に言葉を付けてくれる？」レオはほかの動画で、そうした言葉を見たことがあります。それは字幕と呼ばれています。人が話している内容を示すものです。動画用のソフトを開くと、自分の声から字幕を作れる機能が見つかります。\n\n数分で映像の下に文字が現れます。レオはわくわくします。すべての文を自分で入力する必要がないのです。ところが、もう一度動画を見ると笑ってしまいます。「3本の緑の木」と言ったのに、ソフトは「3本の緑の列車」と書いていたのです。学校の庭に列車はありません。\n\nアンナが残りの確認を手伝ってくれます。二人は短い部分を一つずつ聞き、画面の言葉を読みます。正しい言葉もありますが、少し直す必要のあるものもあります。レオの近くで犬がほえる場面では、一つの文が聞き取りにくくなっています。二人はもう一度聞いて、一緒に字幕を直します。\n\n次に文字の大きさを確認します。最初の字幕は、アンナのスマートフォンでは小さすぎます。レオは文字を大きくします。また、花を隠さないよう字幕の位置も動かします。役立つ字幕は、正しいだけでなく読みやすくなければなりません。読む人が最後まで読めるよう、各文を十分な時間、画面に表示します。\n\n動画を共有する前に、レオは音を消して見てみます。それでも物語を理解できるでしょうか。もう一つ問題を見つけます。ある部分ではアンナが話していますが、字幕では誰が話しているか分かりません。その部分に彼女の名前を加えます。\n\nこの簡単な作業から、レオはテクノロジーについて学びます。道具は素早く作業を始める助けになりますが、その結果を確認する必要はあります。また、動画を見る人のことも考えなければなりません。音がはっきり聞こえない人もいるでしょう。音を出せない静かな場所にいる人もいるかもしれません。\n\n翌日、姉はバスの中で新しい動画を見ます。そして「今度は話が全部分かるよ」とメッセージを送ります。レオは笑顔になります。数行の言葉を加えたことで、より多くの人に庭のことを伝えられたのです。","vocab":[["caption","字幕","This video has clear captions."],["at a time","一度に、〜ずつ","Check one sentence at a time."],["cover","覆う、隠す","The words cover the flowers."],["with the sound off","音を消した状態で","I watched the video with the sound off."],["aloud","声に出して、音を出して","Please read this sentence aloud."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-10-0700.jpg","image_alt":"学校の庭の動画をパソコンとスマートフォンで確認する二人","image_prompt":"Wide 16:9 calm editorial watercolor and pencil illustration for an English essay about checking automatic video captions. Two school-age friends sit at a wooden desk beside a bright window overlooking their school garden. Over-the-shoulder composition focuses on a laptop showing a video of flowers and three small green trees; subtitle area indicated only by a simple pale blank bar, no lettering. One child points thoughtfully at the video while the other compares it with a smartphone. A small camera and a potted seedling on the desk. Warm morning light, muted sage green, soft blue and cream paper texture. Natural thoughtful mood, no text, no letters, no logos, no watermark."},{"date":"2026-11-10","category":"AI・テクノロジー","title":"[12:00] When the Map Meets the Street","ja_title":"地図と目の前の道が違うとき","en":"On her way to a friend's birthday lunch, Nina follows a map on her phone. The blue line leads her toward a narrow street beside the station. The screen says that the restaurant is only five minutes away. Then she looks up and sees a fence across the entrance. Workers are repairing the road, and nobody can walk through.\n\nFor a moment, Nina keeps looking at the screen. The route still seems clear there. However, the fence in front of her is real. She steps aside, checks a sign, and chooses another street. Her phone soon offers a new route. She arrives a little later, but she also arrives with a useful question: what can a digital map tell us, and what can it miss?\n\nA map is a simplified picture of a place. It can show roads, stations, and the distance between two points. A navigation app can use this information to suggest a route. However, a place can change faster than its digital picture. A temporary fence, a closed gate, or a crowded entrance may not appear on the screen.\n\nThere is another problem: the shortest route is not always the best route for every person. Steps may be easy for one traveler but difficult for someone with a heavy suitcase. A dark path may be less comfortable than a busy street. The app's suggestion becomes more useful when we compare it with our own needs.\n\nAfter lunch, Nina and her friend walk to a museum. This time, they look at the whole route before starting. They notice that it crosses a large park. Since rain is beginning to fall, they choose a slightly longer route near shops where they can find shelter. The map helps them understand their choices instead of making the choice for them.\n\nThey also save the museum's address before leaving the restaurant. If the phone loses its connection, they can still show the address to someone and ask for help. This small step gives them another way to reach their destination.\n\nTechnology can make an unfamiliar city easier to explore. Yet using it well does not mean following every instruction without thinking. It means noticing when the information on a screen does not match the world around us.\n\nNina still uses her map on the journey home. She simply looks up more often. The best guide is not always one tool or one person. Sometimes it is a useful combination of digital information, careful attention, and a simple question asked at the right time.","ja":"友達の誕生日ランチへ向かう途中、ニナはスマートフォンの地図に従って歩いています。青い線は駅のそばの細い通りへと続いています。画面には、レストランまであと5分と表示されています。ところが顔を上げると、入口をふさぐ柵が見えます。道路工事中で、誰も通り抜けることができません。\n\nニナは少しの間、画面を見続けます。そこでは道がまだ通れるように見えます。しかし、目の前の柵は現実にあります。彼女は脇によけ、案内板を確認して、別の通りを選びます。すると、スマートフォンはすぐに新しい経路を示します。少し遅れて到着しますが、有益な問いも得ました。デジタル地図は何を教えてくれて、何を見落とすのでしょうか。\n\n地図は、ある場所を簡略化して表したものです。道路や駅、二つの地点の間の距離を示すことができます。ナビゲーションアプリは、こうした情報を使って経路を提案できます。しかし、現実の場所はデジタル上の姿よりも速く変化することがあります。仮設の柵、閉まった門、混雑した入口は、画面に出ていないかもしれません。\n\nもう一つ問題があります。最短の経路が、すべての人にとって最善とは限りません。ある旅行者には簡単な階段でも、重いスーツケースを持った人には大変かもしれません。暗い道は、人通りの多い通りよりも不安に感じられることがあります。アプリの提案は、自分の必要に照らし合わせることで、より役立つものになります。\n\n昼食の後、ニナと友達は博物館へ歩いて向かいます。今度は出発前に経路全体を見ます。大きな公園を横切ることに気づきます。雨が降り始めたので、雨宿りのできる店が近くにある、少し長い経路を選びます。地図は二人に代わって選ぶのではなく、選択肢を理解する助けになっています。\n\n二人はまた、レストランを出る前に博物館の住所を保存します。スマートフォンの通信が途切れても、その住所を誰かに見せて助けを求めることができます。この小さな準備によって、目的地へたどり着く別の方法が得られます。\n\nテクノロジーは、なじみのない街の探索を楽にしてくれます。しかし、上手に使うとは、考えずにすべての指示に従うことではありません。画面の情報と周囲の現実が一致していないときに、それに気づくことです。\n\n帰り道でもニナは地図を使います。ただ、以前より頻繁に顔を上げます。最善の案内役が、いつも一つの道具や一人の人とは限りません。デジタル情報、注意深い観察、そして適切なタイミングで尋ねる簡単な質問を組み合わせることが、役立つ場合もあるのです。","vocab":[["look up","顔を上げる","Nina looked up and saw a fence."],["temporary","一時的な、仮設の","A temporary fence blocked the entrance."],["compare A with B","AをBと比べる","Compare the route with your own needs."],["find shelter","雨風をしのぐ場所を見つける","They found shelter near a shop."],["destination","目的地","We reached our destination before noon."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-10-1200.jpg","image_alt":"地図アプリを手に、通行止めの道と別の歩道を見比べる女性","image_prompt":"Wide 16:9 calm editorial watercolor and pencil illustration. A young adult woman at a quiet city street junction beside a small station, holding a smartphone with a simple abstract blue route line and no labels. She looks up thoughtfully at a temporary pedestrian barrier blocking a narrow side street, and notices a clear alternative sidewalk leading past small shops. Eye-level outdoor composition with the woman to one side and the fork in the street clearly visible. Soft midday light, muted blue, sage green and warm cream, paper texture. No text, letters, logos, watermark, or readable signs. Convey comparing digital directions with real surroundings, not danger."},{"date":"2026-11-10","category":"AI・テクノロジー","title":"[17:00] A Second Copy of a Family Memory","ja_title":"家族の思い出に、もう一つのコピーを","en":"When Emi offered to organize her family's digital photographs, she expected an easy weekend project. There were pictures of birthdays, summer trips, and a dog that had once been small enough to sleep in a shoe. The files filled several folders on her father's old computer. Finding a particular photograph often took longer than anyone expected.\n\nEmi began by giving the folders clear names that included the year and event. She also kept the original files, even when she made brighter versions of some pictures. Soon, the collection was easier to explore. Her father called it a success, but her grandmother asked a different question: \"What happens if the computer stops working?\"\n\nEmi pointed to a second folder on the same computer. \"I copied everything here,\" she said. Then she paused. If the machine failed completely, both folders might become unavailable. Two copies were useful, but their location mattered as much as their number. She realized that an organized collection was not necessarily a protected one.\n\nThe family decided to make another copy on a separate storage device. After checking the files, they disconnected it and put it somewhere safe. They also discussed which photographs could be stored online and who should have access to them. Some pictures included private family moments, so they did not want every file to become part of a shared album.\n\nBefore finishing, Emi tried a small experiment. She chose one photograph and opened its saved copy on another computer. The picture appeared clearly. This simple test gave her more confidence than merely seeing a folder with a familiar name. A copy that nobody can open will not help much when the original disappears.\n\nThe project still needed a routine. New photographs would arrive after every holiday, and a copy made only once would gradually become incomplete. The family agreed to update their saved collection regularly. They wrote down the steps so that the task would not depend entirely on Emi's memory or free time.\n\nThat evening, everyone gathered to look through the photographs. The technology stayed mostly in the background while the stories came forward. A badly framed picture could still bring back a wonderful afternoon. Emi understood that protecting digital files was not simply about managing machines. It was about giving people a better chance to keep something they could never create in exactly the same way again. The extra copy did not replace care, but it made that care practical.","ja":"エミは家族のデジタル写真を整理すると申し出たとき、週末に簡単に片づく作業だと思っていました。誕生日や夏の旅行、かつては靴の中で眠れるほど小さかった犬の写真がありました。ファイルは父親の古いパソコンのいくつものフォルダーに入っていました。特定の写真を見つけるには、皆が思う以上に時間がかかることがよくありました。\n\nエミはまず、年と行事を含む分かりやすい名前をフォルダーにつけました。いくつかの写真を明るく加工したときも、元のファイルを残しました。やがて写真を探しやすくなりました。父親は大成功だと言いましたが、祖母は別のことを尋ねました。「パソコンが動かなくなったら、どうなるの？」\n\nエミは同じパソコン内の別のフォルダーを指さしました。「全部ここにコピーしたよ」と言った後、ふと考え込みました。機械が完全に故障したら、両方のフォルダーを使えなくなるかもしれません。コピーが二つあることは役立ちますが、その数と同じくらい保存場所も重要でした。整理された写真集が、必ずしも守られた写真集ではないと気づいたのです。\n\n家族は、別の記憶装置にもう一つコピーを作ることにしました。ファイルを確認した後、その装置をパソコンから取り外して安全な場所にしまいました。また、どの写真ならオンラインに保存してよいか、誰がアクセスできるようにするかも話し合いました。家族の私的な場面を写した写真もあったので、すべてのファイルを共有アルバムに入れたいわけではありませんでした。\n\n作業を終える前に、エミは小さな実験をしました。写真を一枚選び、その保存済みのコピーを別のパソコンで開いたのです。写真ははっきりと表示されました。この簡単な確認によって、見覚えのある名前のフォルダーをただ見るだけの場合よりも安心できました。誰も開けないコピーは、元のファイルがなくなったときにあまり役立ちません。\n\nこの作業には、まだ習慣づくりが必要でした。休暇のたびに新しい写真が増えるため、一度だけ作ったコピーでは、次第にすべてを含まなくなってしまいます。家族は、保存した写真を定期的に更新することにしました。作業がエミの記憶や空き時間だけに頼るものにならないよう、手順を書き留めました。\n\nその晩、皆で集まって写真を見返しました。技術はほとんど目立たないところで働き、思い出話が主役になりました。構図のよくない写真でも、すてきな午後の記憶をよみがえらせることがあります。エミは、デジタルファイルを守ることは単に機械を管理することではないと理解しました。まったく同じ形では二度と作れないものを、人々が残せる可能性を高めることなのです。追加のコピーは大切に扱う気持ちの代わりにはなりませんが、その気持ちを具体的な行動に変えてくれました。","vocab":[["as much as","〜と同じくらい","The location matters as much as the number of copies."],["have access to","〜を利用・閲覧できる","Only family members have access to this album."],["depend entirely on","全面的に〜に頼る","The task should not depend entirely on one person."],["bring back","（記憶などを）よみがえらせる","This photograph brings back memories of our summer trip."],["in the background","目立たないところで、裏側で","The software works in the background."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-10-1700.jpg","image_alt":"家族が写真を囲み、思い出とデジタルデータを大切に守る場面","image_prompt":"横長16:9。家族のデジタル写真の保存をテーマにした落ち着いた編集イラスト。夜の暖かな居間を斜め上から広く見渡す構図。木製テーブルを囲む日本人の祖母、父親、成人した娘が思い出の写真を楽しむ。テーブルには文字のない写真数枚、古いノートパソコン、ケーブルを外した小さな外付け記憶装置、無地の収納箱。画面には文字やUIを描かず、家族と小犬の写真の雰囲気だけ。柔らかい水彩と色鉛筆、クリーム、くすんだ青、温かな琥珀色。人々の記憶と静かな安心感を中心に。文字・数字・ロゴ・透かしなし。"},{"date":"2026-11-11","category":"投資・経済","title":"[07:00] The Money in the Blue Tin","ja_title":"青い缶のお金は、いくら使える？","en":"On Friday morning, my class sold popcorn at the school fair. Our teacher gave us a blue tin to keep the money in. Before the fair, I could shake the tin and hear one small coin roll around inside. That coin was mine. I took it out and put it in my pocket. Now we were ready.\n\nWe sold each bag for one hundred yen. My friend Jun filled the bags, and I took the money. Our first customer was a little girl with her father. She held her warm bag with both hands. Soon the room smelled so good that our music teacher came down from the second floor to buy a bag.\n\nAt the end of the morning, we had sold twenty bags. I counted the money twice. Two thousand yen! I ran over to Jun. We wanted a new ball for our class, and the one in the shop window cost two thousand yen. “We can buy it today!” I said.\n\nJun was washing the big pot. He dried his hands and took a piece of paper from his pocket. “My mother bought the corn and the oil for us,” he said. “Here is the receipt.” They cost seven hundred yen. My father had also paid three hundred yen for the paper bags. Both parents wanted their money back after the fair.\n\nI put seven hundred yen in one envelope and three hundred yen in another. Then I looked inside the blue tin again. There was one thousand yen left. I could see my mistake now. I had counted the money from our customers, but I had forgotten the money we spent to make the popcorn.\n\nAfter lunch, we told the class about the ball. A boy near the window went to the cupboard and took out our old one. “What about this ball?” he asked. “It just needs some air.” Our teacher had a pump. In a few minutes, we were outside playing with our old ball again. We decided to keep the money for another day.\n\nOn Monday, I gave the blue tin back to our teacher. Inside it was a note for the next class. I wrote what we sold, what we spent, and what we had left. At the bottom, Jun drew a little bag of popcorn. I added a picture of our old ball beside it.","ja":"金曜日の朝、私のクラスは学校のお祭りでポップコーンを売りました。先生は、お金を入れる青い缶を貸してくれました。お祭りが始まる前、缶を振ると、中で小銭が一枚転がる音がしました。それは私のお金でした。取り出してポケットに入れました。これで準備はできました。\n\nポップコーンは一袋100円で売りました。友達のジュンが袋に詰め、私がお金を受け取りました。最初のお客さんは、お父さんと来た小さな女の子でした。女の子は温かい袋を両手で持ちました。やがて部屋にはとてもいいにおいが広がり、音楽の先生も二階から一袋買いに下りてきました。\n\n午前中の販売が終わるまでに、20袋売れました。私はお金を二回数えました。2,000円です！　私はジュンのところに駆け寄りました。私たちはクラスで使う新しいボールが欲しくて、お店のショーウインドーにあったボールはちょうど2,000円でした。「今日買えるよ！」と私は言いました。\n\nジュンは大きな鍋を洗っていました。手を拭くと、ポケットから紙を一枚出しました。「トウモロコシと油は、うちのお母さんが買ってくれたんだ。これがレシートだよ」。合わせて700円でした。紙袋の代金300円も、私の父が立て替えてくれていました。二人とも、お祭りが終わったら返してもらうつもりでした。\n\n私は一つの封筒に700円、もう一つの封筒に300円を入れました。それから、もう一度青い缶をのぞきました。残っていたのは1,000円です。ようやく自分の間違いが分かりました。お客さんから受け取ったお金は数えたのに、ポップコーンを作るために使ったお金を忘れていたのです。\n\n昼食の後、私たちはクラスのみんなにボールの話をしました。窓のそばにいた男の子が戸棚に行き、古いボールを取り出しました。「このボールはどう？　少し空気を入れればいいよ」。先生が空気入れを持っていました。数分後には、また外で古いボールを使って遊んでいました。お金は別の日のために取っておくことにしました。\n\n月曜日、私は青い缶を先生に返しました。中には、次に使うクラスに宛てたメモを入れておきました。何を売り、いくら使い、いくら残ったかを書きました。一番下にジュンが小さなポップコーンの袋を描きました。私はその隣に、あの古いボールを描き足しました。","vocab":[["each bag","一袋一袋、それぞれの袋","Each bag costs one hundred yen."],["receipt","レシート、領収書","Please keep the receipt in the tin."],["get one's money back","払ったお金を返してもらう","Jun’s mother got her money back on Friday."],["have ... left","〜が残っている","We have five bags left."],["keep ... for another day","〜を別の日のために取っておく","Let’s keep this money for another day."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-11-0700.jpg","image_alt":"学校のお祭りでポップコーンを売り、青い缶に代金を集める子どもたち","image_prompt":"Horizontal 16:9 editorial watercolor and colored pencil illustration for an English reader. Close, tabletop-level view at a Japanese school fair in soft morning daylight. An open well-used blue metal biscuit tin with a few Japanese coins, two small plain envelopes, a little paper bag brimming with fluffy popcorn, a plain pot behind. Two schoolchildren in simple aprons, one passing a coin to the other, their faces softly in focus above the tin. Natural subtle color, warm paper texture, storytelling book art. No text, digits, lettering, logos or watermarks."},{"date":"2026-11-11","category":"投資・経済","title":"[12:00] How Many Saturdays?","ja_title":"あと何回、土曜日に滑れる？","en":"When I was fourteen, I could skate across our town's ice rink without holding the wall. Turning around was another story. I wanted to learn before the rink closed for the season. One Saturday, I stopped at the ticket window and saw a new sign. A pass for the last six Saturdays cost 3,000 yen. A single ticket cost 600 yen.\n\nI had my own skates, so the ticket was all I needed. I did the math on the back of an old shopping list. Six single tickets would cost 3,600 yen. With the pass, I could save 600 yen. I was ready to buy it when my sister asked, “Can you name the six days you'll actually go?”\n\nWe sat down on a bench and opened the calendar on her phone. The first Saturday was today, and we were already at the rink. On the second, our family was visiting my grandfather. I had a school concert on the fourth. That left four Saturdays, including today. Four tickets would cost 2,400 yen. I turned the shopping list over and wrote the new number in larger letters.\n\n“What about your friend Yuki?” my sister asked. Yuki came to the rink every week. I found her by the wall, helping a little boy stand up. She had bought the pass that morning. “My dad works here on Saturdays,” she explained. “I come with him, even when my friends are busy.” For Yuki, six visits were a good guess. The same sign at the same window offered us quite different deals.\n\nI bought one ticket and put the shopping list in my shoe while I skated. By the end of the afternoon, I could turn around slowly. On the way home, my sister asked how many visits would make the two prices equal. I pictured five tickets in a row. Five times 600 was exactly 3,000. I would have to go a sixth time before the pass saved me any money.\n\nI ended up skating on all four of my free Saturdays. On the last one, Yuki filmed me turning a full circle. Later, I found the shopping list in my coat. Both numbers were still there. The first one showed what six visits would cost. The second showed what I could actually spend. These days, when I see a pass for sale, I reach for my calendar before I reach for my wallet.","ja":"14歳の頃、私は町のスケートリンクで、壁につかまらずに反対側まで滑れるようになっていました。でも、向きを変えるとなると話は別でした。今シーズンの営業が終わる前に覚えたいと思っていました。ある土曜日、チケット売り場で足を止めると、新しい案内が目に入りました。シーズン最後の6回の土曜日に使えるパスは3,000円。1回券は600円でした。\n\nスケート靴は自分のものがあったので、必要なのはチケットだけでした。古い買い物メモの裏で計算しました。1回券を6枚買えば3,600円。パスを買えば600円浮きます。買おうとしたとき、姉に聞かれました。「実際に行く日を、6日とも言える？」\n\n二人でベンチに座り、姉のスマホでカレンダーを開きました。最初の土曜日は今日で、もうリンクに来ています。2回目の土曜日は家族で祖父を訪ねる予定でした。4回目には学校のコンサートがあります。すると、行ける土曜日は今日を入れて4回。チケット4枚なら2,400円です。私は買い物メモをひっくり返し、新しい金額を大きく書きました。\n\n「友達のユキはどうかしら？」と姉が聞きました。ユキは毎週リンクに来ていました。壁際で、小さな男の子が立ち上がるのを手伝っているユキを見つけました。その朝、すでにパスを買ったそうです。「土曜日はお父さんがここで働いているの。友達が忙しい日も、お父さんと一緒に来るんだ」。ユキにとって、6回来るという見込みは現実的でした。同じ窓口の同じ案内でも、どれだけお得かは二人でずいぶん違いました。\n\n私は1回券を買い、滑っている間は買い物メモを脱いだ靴にしまっておきました。その日の夕方には、ゆっくりなら向きを変えられるようになっていました。帰り道、姉に「何回行けば、どちらも同じ金額になる？」と聞かれました。チケットが5枚並んでいるところを思い浮かべました。600円の5回分はちょうど3,000円。パスでお金が浮くのは、6回目に行ったときでした。\n\n結局、予定の空いていた4回の土曜日すべてに滑りに行きました。最後の日には、私がくるりと一回転するところをユキが撮ってくれました。後でコートの中から買い物メモが出てきました。二つの金額がまだ残っていました。最初の数字は、6回行く場合の費用。次の数字は、実際に行ける日数で使う金額です。今では、パスが売られているのを見ると、財布に手を伸ばす前にカレンダーを開きます。","vocab":[["do the math","計算して確かめる","Let's do the math before we buy the pass."],["including today","今日を含めて","I have three days off, including today."],["in a row","一列に並んで","She placed five tickets in a row."],["end up doing","結局〜することになる","We ended up walking home."],["reach for","〜に手を伸ばす","He reached for his wallet at the ticket window."]],"is_preview":false,"image_url":"https://seikoubon.github.io/daily-english-library/assets/key-visuals/2026-11-11-1200.jpg","image_alt":"リンク脇のベンチでチケットとカレンダーを見比べる姉妹","image_prompt":"Wide 16:9 horizontal editorial illustration in gentle watercolor and fine colored pencil. Quiet Japanese municipal ice rink seen in a wide side view from the bench beside the ice. In the left foreground two teenage Japanese sisters in winter coats sit together, comparing a small unmarked paper ticket and a phone calendar shown only as a pale small grid of blank squares, absolutely no legible marks. White ice skates at their feet. On the far right in the distance a young skater traces an elegant circle in blue-gray ice. Airy winter daylight, muted teal, gray and warm coral. Thoughtful candid moment, generous space, no letters, numbers, text, logos or watermarks."}],idx=0,mode='en',done={};
const slot=a=>/^\[(07:00|12:00|17:00)\] /.exec(a.title)?.[1]||'';
const grade=a=>({'07:00':'英検3級程度','12:00':'英検準2級程度','17:00':'英検2級程度'}[slot(a)]||'英検2級程度（従来記事）');
const displayTitle=a=>a.title.replace(/^\[(07:00|12:00|17:00)\] /,'');
const articleKey=a=>a.is_preview?'sample|'+a.date+'|'+a.title:'article|'+a.date+(slot(a)?'|'+slot(a):'');
const seedArticles=articles; const key=articleKey;
function valid(a){return a&&['date','category','title','en','ja'].every(k=>typeof a[k]==='string'&&a[k].trim())&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)&&Array.isArray(a.vocab)&&a.vocab.every(v=>Array.isArray(v)&&v.length>=2&&v.every(x=>typeof x==='string'))}
function merge(old,add){const m=new Map(old.map(a=>[key(a),a]));add.forEach(a=>m.set(key(a),a));return [...m.values()].sort((a,b)=>Number(!!a.is_preview)-Number(!!b.is_preview)||b.date.localeCompare(a.date)||slot(b).localeCompare(slot(a)))}
try {const saved=JSON.parse(localStorage.getItem('dailyEnglishArticles')||'[]');if(Array.isArray(saved)&&saved.every(valid))articles=merge(saved,articles);done=JSON.parse(localStorage.getItem('dailyEnglishDone')||'{}')||{};}catch{}
articles=merge([],articles);
function save(){try{localStorage.setItem('dailyEnglishArticles',JSON.stringify(articles));localStorage.setItem('dailyEnglishDone',JSON.stringify(done));return true}catch{return false}}
function importData(raw){const parsed=JSON.parse(raw);const data=Array.isArray(parsed)?parsed:(Array.isArray(parsed.articles)?parsed.articles:[parsed]);if(!data.length||data.length>5000||!data.every(valid))throw Error('記事の必須項目または重要表現の形式を確認してください。');articles=merge(articles,data);idx=articles.findIndex(a=>key(a)===key(data[0]));categories();render();$('#status').textContent=save()?data.length+'件を取り込みました。':'取り込みましたがブラウザに保存できません。JSONで保存してください。';}
const $=s=>document.querySelector(s);
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value;const filtered=articles.map((a,i)=>({...a,i})).filter(a=>(!cat||a.category===cat)&&(!$('#level').value||($('#level').value==='legacy'?!slot(a):slot(a)===$('#level').value))&&(a.title+' '+(a.ja_title||'')+' '+a.en+' '+a.ja+' '+JSON.stringify(a.vocab)).toLowerCase().includes(q));
if(filtered.length&&!filtered.some(a=>a.i===idx))idx=filtered[0].i;$('#count').textContent=filtered.length+' 件の記事';$('#list').replaceChildren(...filtered.map(a=>{let b=node('button','');b.className='story'+(a.i===idx?' active':'');b.append(node('div',(a.is_preview?'サンプル · ':'')+a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category),node('div',displayTitle(a)));b.children[0].className='small';b.children[1].className='title';b.onclick=()=>{idx=a.i;render()};return b}));
document.querySelector('.article').hidden=!filtered.length;if(!filtered.length)return;const a=articles[idx];if(!a)return;$('#title').textContent=displayTitle(a);$('#gradeTag').textContent=grade(a);$('#jtitle').textContent=a.ja_title;$('#meta').textContent=a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category;$('#preview').textContent=(a.is_preview?'短縮サンプル':'正式記事')+' · '+a.en.trim().split(/\s+/).length+' words';
let content=$('#content');content.replaceChildren();if(a.image_url){try{const u=new URL(a.image_url,location.href);if(u.protocol==='https:'||u.origin===location.origin){const figure=document.createElement('figure');figure.style.margin='0 0 20px';const img=document.createElement('img');img.src=u.href;img.alt=a.image_alt||a.ja_title||displayTitle(a);img.style.cssText='display:block;width:100%;height:auto;border-radius:12px';img.decoding='async';img.onerror=()=>{img.hidden=true;const warning=node('p','画像を読み込めませんでした。');warning.setAttribute('role','status');const retry=node('button','画像を再読み込み');retry.onclick=()=>{warning.remove();retry.remove();img.hidden=false;img.src=u.href};figure.append(warning,retry)};figure.append(img);const caption=node('figcaption','AI生成イメージ');caption.className='small';figure.append(caption);content.append(figure)}}catch{}}if(!a.image_url&&!a.is_preview){const pending=node('p','この記事の画像はまだ届いていません。');pending.className='small';pending.setAttribute('role','status');content.append(pending)}if(mode==='en'||mode==='both'){content.append(node('h3','English'),node('p',a.en))}
if(mode==='ja'||mode==='both'){content.append(node('h3','日本語訳'),node('p',a.ja))}
$('#vocab').replaceChildren(...a.vocab.map(([word,meaning,example])=>{const tr=document.createElement('tr');const cell=node('td',meaning);if(example)cell.append(node('p',example));tr.append(node('td',word),cell);return tr}));
['En','Both','Ja'].forEach((n,i)=>$('#show'+n).classList.toggle('active',mode===['en','both','ja'][i]));['En','Both','Ja'].forEach((n,i)=>$('#show'+n).setAttribute('aria-pressed',mode===['en','both','ja'][i]));$('#done').textContent=done[a.date+'|'+a.title]?'✓ 読了':'未読'}
function categories(){const current=$('#category').value;$('#category').replaceChildren(new Option('すべて',''),...[...new Set(articles.map(a=>a.category))].map(x=>new Option(x,x)));$('#category').value=current}
$('#search').oninput=render;$('#category').onchange=render;$('#level').onchange=render;['En','Both','Ja'].forEach((n,i)=>$('#show'+n).onclick=()=>{mode=['en','both','ja'][i];render()});$('#done').onclick=()=>{const a=articles[idx],k=a.date+'|'+a.title;done[k]=!done[k];if(!save())$('#status').textContent='既読状態を保存できませんでした。';render()};
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(articles,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='daily_english_articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('ファイルは10MB以内にしてください。');importData(await f.text())}catch(err){$('#status').textContent='読み込み失敗: '+err.message}finally{e.target.value=''}};
$('#importPaste').onclick=()=>{try{importData($('#paste').value);$('#paste').value=''}catch(err){$('#status').textContent='読み込み失敗: '+err.message}};
categories();render();</script></body></html>
