enjoys it. They write the new recipe in a notebook so they can make it again.\n\nThe next time Ken visits the market, he checks the prices and asks about the fruit. He does not expect every price change to have one simple cause. Still, he knows where to begin: notice what changed, compare the choices, and ask a clear question. A small shopping trip can teach us a lot about how an economy works.","ja":"土曜の朝、ケンは母と小さな市場に行きます。パイ用のリンゴを買いたいのです。先週は一袋300円でしたが、今日は同じ種類の袋が400円です。なぜ値段が変わったのか不思議に思います。\n\n店の人によると、今週は届いたリンゴが少なかったそうです。近くの農園で強風が果物の一部を傷つけました。リンゴを欲しいお客さんは多いままですが、売れる袋は減っています。この架空の市場では、それが値上がりの理由の一つです。\n\nケンは別の台を見ます。洋ナシがたくさん並び、今日はリンゴより安く売られています。母が「代わりに洋ナシのケーキを作れないかな」と尋ねます。ケンは食べたことがありませんが、よい考えだと思い、予定を変えます。\n\n値段は情報を伝えてくれます。高い値段は、手に入りにくくなったことを示すかもしれません。安い値段は、違う選択肢を試すきっかけになります。しかし、値段ですべてが分かるわけではありません。質問し、買う物をよく見る必要があります。\n\n例えば、似た袋でも果物の量が違うかもしれません。一方には小さいリンゴ、もう一方には大きいリンゴが入っていることもあります。今日中に食べる必要がある果物もあるでしょう。表示の数字だけでは、こうした違いを見落とします。\n\n店の人にも費用がかかります。果物、売り場、農園への移動にお金を払います。400円で一袋売っても、400円がもうけになるわけではありません。一部はその費用に充てます。\n\nケンは市場を違った目で見始めます。お金と食べ物を交換するだけの場所ではありません。農家、運転手、店の人、お客さんがそれぞれ選択しています。一つの農園で起きた変化が、何を焼くか考える家族に影響することもあります。\n\n午後、ケンと母は洋ナシのケーキを作ります。予定していたアップルパイとは違いますが、みんながおいしく食べました。また作れるよう、新しいレシピをノートに書きます。\n\n次に市場に来たとき、ケンは値段を確かめ、果物について尋ねます。どの値段の変化にも単純な原因が一つだけあるとは思いません。それでも、変化に気づき、選択肢を比べ、分かりやすく質問するところから始められます。小さな買い物でも、経済の仕組みをたくさん学べるのです。","vocab":[["arrive","届く・到着する","Fewer apples arrived this week."],["instead","代わりに","We bought pears instead."],["amount","量","Check the amount of fruit in the bag."],["cost","費用","The seller must pay several costs."],["affect","影響する","Bad weather can affect a farm."]]},{"date":"2026-11-07","category":"投資・経済","title":"[12:00] The Tool We Only Need Once","ja_title":"一度しか使わない道具","is_preview":false,"en":"Mina wants to put a small shelf in her room. She needs a tool for the job, but she does not own one. At the shop, she finds several models with different prices. Before choosing the cheapest, she asks herself a different question: does she need to own this tool at all?\n\nSuppose a nearby community center lends tools to residents. Mina could borrow the one she needs for a weekend. In this imagined example, borrowing costs much less than buying. It also means she will not need to find space for the tool after the shelf is finished.\n\nHowever, borrowing is not completely free of effort. Mina must check whether the tool is available, collect it during opening hours, and return it on time. If the center is far away, the journeys may take longer than the job itself. The lowest money cost is not always the easiest choice.\n\nBuying has advantages too. If Mina expects to make furniture regularly, having her own tool could be convenient. She could use it whenever she has time and become familiar with how it works. A purchase that seems unnecessary for one project may make sense for many projects.\n\nThere is also another possibility: asking someone who already owns the tool to help. A neighbor might enjoy showing her how to use it correctly. Mina should still agree on a suitable time and treat the tool with care. Sharing works better when people respect each other's time and property.\n\nThis decision is an example of looking beyond the price tag. The full cost of a choice can include storage, travel, learning, and maintenance. The benefits can include convenience, independence, and the chance to develop a skill. Different people may reasonably choose different options.\n\nMina writes down three questions. How often will I use it? Where will I keep it? What will I do if it breaks? She does not need perfect answers, but the questions help her avoid buying something simply because it is on sale.\n\nIn the end, she borrows a tool for her first project. If she discovers that she enjoys making things, she can consider buying one later. Trying a small project gives her information about her actual needs.\n\nThe finished shelf holds several books and a plant. The tool has gone back to the community center, ready for another person. Mina has gained more than a shelf. She has learned that access to something can sometimes be more useful than ownership.","ja":"ミナは部屋に小さな棚を取り付けたいと思っています。作業に必要な道具を持っていません。店では値段の違う数種類が見つかります。最も安い物を選ぶ前に、そもそも自分で所有する必要があるのかと考えます。\n\n近所の地域センターが住民に道具を貸しているとします。ミナは週末に借りられるかもしれません。この架空の例では、借りる方が買うよりずっと安く済みます。棚が完成した後の保管場所も不要です。\n\nただし、借りることにも手間はかかります。貸し出し可能か確認し、開館時間内に受け取り、期限までに返す必要があります。遠ければ、作業そのものより往復に時間がかかるかもしれません。金額が最小の選択が、最も楽とは限りません。\n\n買うことにも利点があります。定期的に家具を作るなら、自分の道具があると便利でしょう。時間があるときに使え、使い方にも慣れます。一度の作業には不要に思える購入も、多くの作業には意味があるかもしれません。\n\nすでに道具を持っている人に手伝ってもらう方法もあります。近所の人が正しい使い方を喜んで教えてくれるかもしれません。その場合も都合のよい時間を決め、道具を大切に扱うべきです。お互いの時間や持ち物を尊重すると、共有はうまくいきます。\n\nこの判断は、値札の先まで考える例です。選択にかかる費用全体には、保管、移動、習得、手入れも含まれます。利点には、便利さ、自分でできること、技能を身につける機会があります。人によって違う選択をしても不合理ではありません。\n\nミナは三つの質問を書きます。どのくらい使うか。どこにしまうか。壊れたらどうするか。完璧な答えは要りませんが、安売りというだけで買うのを避ける助けになります。\n\n結局、最初の作業には借りることにします。物作りを楽しめると分かったら、後で買うことを考えられます。小さく試すことで、実際に必要なものが見えてきます。\n\n完成した棚には数冊の本と植物が置かれました。道具はセンターに戻り、次の人を待っています。ミナが得たのは棚だけではありません。使えることが、持っていることより役立つ場合もあると学んだのです。","vocab":[["own","所有する","She does not own a tool."],["available","利用できる","Is the tool available this weekend?"],["on time","期限どおりに","Return the tool on time."],["price tag","値札","Look beyond the price tag."],["ownership","所有","Access may matter more than ownership."]]}],idx=0,mode='en',done={};

const grade=a=>({'07:00':'英検3級程度','12:00':'英検準2級程度','17:00':'英検2級程度'}[slot(a)]||'英検2級程度（従来記事）');

function valid(a){return a&&['date','category','title','en','ja'].every(k=>typeof a[k]==='string'&&a[k].trim())&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)&&Array.isArray(a.vocab)&&a.vocab.every(v=>Array.isArray(v)&&v.length>=2&&v.every(x=>typeof x==='string'))}
function merge(old,add){const m=new Map(old.map(a=>[key(a),a]));add.forEach(a=>m.set(key(a),a));return [...m.values()].sort((a,b)=>Number(!!a.is_preview)-Number(!!b.is_preview)||b.date.localeCompare(a.date)||slot(b).localeCompare(slot(a)))}
try {const saved=JSON.parse(localStorage.getItem('dailyEnglishArticles')||'[]');if(Array.isArray(saved)&&saved.every(valid))articles=merge(saved,articles);done=JSON.parse(localStorage.getItem('dailyEnglishDone')||'{}')||{};}catch{}
articles=merge([],articles);
function save(){try{localStorage.setItem('dailyEnglishArticles',JSON.stringify(articles));localStorage.setItem('dailyEnglishDone',JSON.stringify(done));return true}catch{return false}}
function importData(raw){const parsed=JSON.parse(raw);const data=Array.isArray(parsed)?parsed:(Array.isArray(parsed.articles)?parsed.articles:[parsed]);if(!data.length||data.length>5000||!data.every(valid))throw Error('記事の必須項目または重要表現の形式を確認してください。');articles=merge(articles,data);idx=articles.findIndex(a=>key(a)===key(data[0]));categories();render();$('#status').textContent=save()?data.length+'件を取り込みました。':'取り込みましたがブラウザに保存できません。JSONで保存してください。';}
const $=s=>document.querySelector(s);
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value;const filtered=articles.map((a,i)=>({...a,i})).filter(a=>(!cat||a.category===cat)&&(!$('#level').value||($('#level').value==='legacy'?!slot(a):slot(a)===$('#level').value))&&(a.title+' '+(a.ja_title||'')+' '+a.en+' '+a.ja+' '+JSON.stringify(a.vocab)).toLowerCase().includes(q));
if(filtered.length&&!filtered.some(a=>a.i===idx))idx=filtered[0].i;$('#count').textContent=filtered.length+' 件の記事';$('#list').replaceChildren(...filtered.map(a=>{let b=node('button','');b.className='story'+(a.i===idx?' active':'');b.append(node('div',(a.is_preview?'サンプル · ':'')+a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category),node('div',displayTitle(a)));b.children[0].className='small';b.children[1].className='title';b.onclick=()=>{idx=a.i;render()};return b}));
document.querySelector('.article').hidden=!filtered.length;if(!filtered.length)return;const a=articles[idx];if(!a)return;$('#title').textContent=displayTitle(a);$('#gradeTag').textContent=grade(a);$('#jtitle').textContent=a.ja_title;$('#meta').textContent=a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category;$('#preview').textContent=(a.is_preview?'短縮サンプル':'正式記事')+' · '+a.en.trim().split(/\s+/).length+' words';
let content=$('#content');content.replaceChildren();if(a.image_url){try{const u=new URL(a.image_url,location.href);if(u.protocol==='https:'||u.origin===location.origin){const figure=document.createElement('figure');figure.style.margin='0 0 20px';const img=document.createElement('img');img.src=u.href;img.alt=a.image_alt||a.ja_title||displayTitle(a);img.style.cssText='display:block;width:100%;height:auto;border-radius:12px';img.decoding='async';img.onerror=()=>{img.hidden=true;const warning=node('p','画像を読み込めませんでした。');warning.setAttribute('role','status');const retry=node('button','画像を再読み込み');retry.onclick=()=>{warning.remove();retry.remove();img.hidden=false;img.src=u.href};figure.append(warning,retry)};figure.append(img);const caption=node('figcaption','AI生成イメージ');caption.className='small';figure.append(caption);content.append(figure)}}catch{}}if(!a.image_url&&!a.is_preview){const pending=node('p','この記事の画像はまだ届いていません。');pending.className='small';pending.setAttribute('role','status');content.append(pending)}if(mode==='en'||mode==='both'){content.append(node('h3','English'),node('p',a.en))}
if(mode==='ja'||mode==='both'){content.append(node('h3','日本語訳'),node('p',a.ja))}
$('#vocab').replaceChildren(...a.vocab.map(([word,meaning,example])=>{const tr=document.createElement('tr');const cell=node('td',meaning);if(example)cell.append(node('p',example));tr.append(node('td',word),cell);return tr}));
['En','Both','Ja'].forEach((n,i)=>$('#show'+n).classList.toggle('active',mode===['en','both','ja'][i]));['En','Both','Ja'].forEach((n,i)=>$('#show'+n).setAttribute('aria-pressed',mode===['en','both','ja'][i]));$('#done').textContent=done[a.date+'|'+a.title]?'✓ 読了':'未読'}
function categories(){const current=$('#category').value;$('#category').replaceChildren(new Option('すべて',''),...[...new Set(articles.map(a=>a.category))].map(x=>new Option(x,x)));$('#category').value=current}
$('#search').oninput=render;$('#category').onchange=render;$('#level').onchange=render;['En','Both','Ja'].forEach((n,i)=>$('#show'+n).onclick=()=>{mode=['en','both','ja'][i];render()});$('#done').onclick=()=>{const a=articles[idx],k=a.date+'|'+a.title;done[k]=!done[k];if(!save())$('#status').textContent='既読状態を保存できませんでした。';render()};
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(articles,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='daily_english_articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('ファイルは10MB以内にしてください。');importData(await f.text())}catch(err){$('#status').textContent='読み込み失敗: '+err.message}finally{e.target.value=''}};
$('#importPaste').onclick=()=>{try{importData($('#paste').value);$('#paste').value=''}catch(err){$('#status').textContent='読み込み失敗: '+err.message}};
categories();render();</script></body></html>
