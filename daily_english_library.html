<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English Library</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b35;background:#f3f6f6}*{box-sizing:border-box}body{margin:0}header{background:#133b46;color:#fff;padding:28px max(20px,calc((100% - 1080px)/2))}header h1{margin:0 0 6px;font-size:28px}header p{margin:0;color:#cadddf;font-size:14px}
main{max-width:1080px;margin:auto;padding:24px 18px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px}.panel{background:white;border:1px solid #dce5e6;border-radius:14px;padding:20px;box-shadow:0 2px 9px #25414a0b}
input,select,button{font:inherit;border-radius:9px;padding:10px}input,select{border:1px solid #bccdd0;width:100%;margin-bottom:10px}button{border:1px solid #aac0c3;background:#f0f6f6;color:#153e46;cursor:pointer}button.active,.primary{background:#155c67;color:white;border-color:#155c67}.stack{display:grid;gap:8px}.story{display:block;text-align:left;width:100%;padding:13px;border:1px solid #dce5e6;background:white}.story.active{border-color:#155c67;background:#eaf4f3}.small{font-size:12px;color:#678087}.title{font-weight:700;margin:6px 0}.article h2{font-size:27px;margin:10px 0 6px}.article p{white-space:pre-line;line-height:1.85}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tag{font-size:12px;background:#edf4f5;border-radius:100px;padding:5px 10px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.vocab{width:100%;border-collapse:collapse}.vocab td{border-bottom:1px solid #e6eded;padding:11px 6px}footer{font-size:12px;color:#627d85;margin-top:18px}@media(max-width:760px){main{display:block}.panel{margin-bottom:16px}header{padding:24px 18px}}
textarea{width:100%;font:inherit;border:1px solid #bccdd0;border-radius:8px;padding:10px}summary{cursor:pointer;font-weight:600;margin:16px 0}a{color:#155c67}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d39b42;outline-offset:2px}.article p{font-size:18px}.story.active{color:#153e46}header{border-bottom:4px solid #cda56d}.panel{box-shadow:none}body{background:#f5f3ee}.vocab p{font-size:14px;font-style:italic}@media(max-width:760px){#list{max-height:260px;overflow:auto}.article h2{font-size:25px}.article p{font-size:17px}}
</style></head><body><header><h1>Daily English Library</h1><p>英語を読みながら、世界を学ぶ。1日3回・約400語の英語エッセイ</p></header>
<main><aside class="panel"><label for="search">記事を検索</label><input id="search" placeholder="タイトル・本文から検索"><label for="category">ジャンル</label><select id="category"><option value="">すべて</option></select><label for="level">難易度</label><select id="level"><option value="">すべて</option><option value="07:00">英検3級程度 · 7:00</option><option value="12:00">英検準2級程度 · 12:00</option><option value="17:00">英検2級程度 · 17:00</option><option value="legacy">従来記事</option></select><p class="small" id="count" aria-live="polite"></p><div id="list" class="stack"></div><hr><label for="upload" class="small">JSONファイルを読み込む</label><input id="upload" type="file" accept=".json,application/json"><button id="export">記事をJSONで保存</button><details><summary>記事を追加・同期</summary><p class="small">記事JSONを上で読み込むか、下に貼り付けてください。既存記事は保持し、同じ日付・配信枠の記事だけを更新します。</p><textarea id="paste" rows="5" aria-label="記事JSON" placeholder="記事JSONを貼り付け"></textarea><button id="importPaste">追加する</button><p id="status" role="status" class="small"></p><p class="small">毎日7:00・12:00・17:00（日本時間）の配信後に更新されます。ここで取り込んだ記事は、このブラウザ内に保存されます。</p></details></aside>
<section class="panel article"><div class="small" id="meta"></div><h2 id="title"></h2><div class="small" id="jtitle"></div><div class="tags"><span class="tag" id="gradeTag"></span><span class="tag" id="preview"></span></div><div class="controls"><button id="showEn" class="active">英文</button><button id="showBoth">英文＋日本語</button><button id="showJa">日本語訳</button><button id="done">未読</button></div><div id="content"></div><details open><summary>重要表現</summary><table class="vocab" id="vocab"></table></details><footer>「短縮サンプル」は試作記事です。正式記事とは区別しています。追加記事・既読状態はこのブラウザに保存されます。別端末へ移す場合はJSONで保存してください。</footer></section></main>
<script>let articles=[{"date":"2026-11-02","category":"AI・テクノロジー","title":"An AI Study Partner: Useful, but Not a Shortcut","ja_title":"AIは学習の相棒。でも近道ではない","en":"Imagine you are reading an English article and find a sentence you cannot understand. In the past, you might have opened a dictionary, searched for a grammar rule, or asked a teacher. Today, you can also ask an AI tool to explain the sentence in simpler English. This is one reason AI is becoming a useful study partner.\n\nOne advantage of AI is that it can adjust to your level. If an explanation is too difficult, you can ask for an easier one. If you already understand the basics, you can request more challenging examples. You can also practice a conversation without worrying about making mistakes in front of other people.\n\nAI can help you build a daily learning routine. For example, you might read a short essay each morning. After reading, you could ask AI to create three questions about the main ideas. You could then answer those questions in your own words. This small exercise helps you check whether you really understood the text.\n\nHowever, there is an important difference between getting an answer and learning something. If AI translates every sentence immediately, you may finish the article quickly but remember very little. Sometimes it is better to guess the meaning from the context before asking for help. The effort you make is part of the learning process.\n\nOne practical rule is to spend a few minutes thinking before asking AI for the answer. Then compare your idea with its explanation and correct any misunderstanding.\n\nAnother problem is that AI is not always correct. It may give an explanation that sounds confident but contains an error. When a fact is important, you should compare the answer with a reliable source. For language questions, a good dictionary or a trusted textbook can be helpful.\n\nYou should also decide what you want AI to do. Instead of saying, “Teach me English,” try a specific request such as, “Ask me five questions about this article, one at a time.” Clear instructions often lead to more useful practice.\n\nFinally, remember that learning is a long journey. You do not need to understand every word today. Reading regularly, reviewing useful expressions, and noticing your progress are more important than finishing one difficult lesson perfectly.\n\nAI can make studying more convenient and personal, but it cannot practice for you. The best approach is to use it as a patient assistant while keeping your own mind active.","ja":"英語の記事を読んでいて、理解できない一文に出会ったと想像してください。以前なら、辞書を開いたり、文法規則を調べたり、先生に質問したりしたでしょう。今では、AIツールにその文をもっと簡単な英語で説明してもらうこともできます。これが、AIが便利な学習の相棒になりつつある理由の一つです。\n\nAIの利点の一つは、あなたのレベルに合わせられることです。説明が難しすぎれば、もっと簡単にしてほしいと頼めます。基礎をすでに理解していれば、より難しい例を求めることもできます。また、ほかの人の前で間違える心配をせずに会話の練習もできます。\n\nAIは毎日の学習習慣を作る助けにもなります。例えば、毎朝短いエッセイを読むとします。読んだ後、主な内容について3つの質問をAIに作ってもらえます。そして、その質問に自分の言葉で答えます。この小さな練習によって、文章を本当に理解したか確認できます。\n\nただし、答えを得ることと何かを学ぶことには重要な違いがあります。AIがすべての文をすぐに翻訳してくれれば、記事を素早く読み終えられるかもしれませんが、ほとんど覚えていないかもしれません。助けを求める前に、文脈から意味を推測した方がよいこともあります。自分で努力することも学習過程の一部なのです。\n\n実践的なルールの一つは、AIに答えを尋ねる前に数分間自分で考えることです。その後、自分の考えをAIの説明と比べ、誤解していた点を直しましょう。\n\nもう一つの問題は、AIが必ずしも正しいとは限らないことです。自信がありそうに聞こえても、間違いを含む説明をすることがあります。重要な事実については、信頼できる情報源と答えを照らし合わせるべきです。言語に関する疑問なら、良い辞書や信頼できる教科書が役立ちます。\n\nまた、AIに何をしてほしいのかを決めることも大切です。「英語を教えて」と言う代わりに、「この記事について5つの質問を、一度に一つずつしてください」のように具体的に頼んでみましょう。明確な指示は、より役立つ練習につながることが多いのです。\n\n最後に、学習は長い道のりだということを忘れないでください。今日、すべての単語を理解する必要はありません。定期的に読み、役立つ表現を復習し、自分の進歩に気づくことは、難しいレッスンを一度で完璧に終えることよりも重要です。\n\nAIは勉強をより便利に、一人ひとりに合ったものにできます。しかし、あなたの代わりに練習することはできません。最も良い方法は、自分の頭を働かせながら、AIを辛抱強い助手として利用することです。","vocab":[["adjust to your level","あなたのレベルに合わせる","A good study plan should adjust to your level."],["in your own words","自分の言葉で","Explain the idea in your own words."],["from the context","文脈から","Try to guess the meaning from the context."],["reliable source","信頼できる情報源","Check important facts with a reliable source."],["one at a time","一度に一つずつ","Please ask me the questions one at a time."]],"is_preview":false},{"date":"2026-11-02","category":"AI・テクノロジー","title":"How AI Is Changing the Way We Learn","ja_title":"AIは私たちの学び方をどう変えているのか","en":"Artificial intelligence is changing how people learn. In a traditional classroom, students often use the same materials at the same speed. AI can offer explanations that match each student's needs.\n\nFor example, an English learner can ask AI to explain a difficult grammar rule using simple words. AI can also provide new examples and exercises. This makes it easier to study at your own speed.\n\nHowever, AI sometimes makes mistakes. Receiving an explanation is not the same as understanding a subject. Real learning still requires practice, careful thinking, and repeated effort.","ja":"人工知能は人々の学び方を変えています。従来の教室では、生徒は同じ教材を同じ速度で学ぶことがよくあります。AIは一人ひとりに合った説明を提供できます。\n\n例えば、英語学習者は難しい文法を簡単な言葉で説明するようAIに頼めます。新しい例文や練習問題も作れます。そのため、自分のペースで勉強しやすくなります。\n\nただし、AIも間違えることがあります。説明を受けることと理解することは別です。実際の学習には練習、慎重な思考、繰り返しの努力が必要です。","vocab":[["at one's own speed","自分のペースで","You can study at your own speed."],["throughout one's life","生涯を通じて","Learning continues throughout one's life."],["depend on","～に頼る","Do not depend on AI for every answer."],["rather than","～ではなく","Read every day rather than only on weekends."],["remain responsible for","～に責任を持ち続ける","You remain responsible for checking the facts."]],"is_preview":true},{"date":"2026-11-03","category":"投資・経済","title":"Why Patience Matters in Investing","ja_title":"投資で忍耐が重要な理由","en":"Many people try to predict the next rise or fall in stock prices. Yet even professional investors find it difficult to make correct short-term predictions consistently.\n\nValue investors study a company's profits, financial condition, and business prospects. They look for shares that appear inexpensive compared with the value of the business. Dividends can also provide income while investors continue to hold their shares.\n\nPatience does not mean ignoring bad news. A strong company can become weak because of competition or poor management. Good investing requires both a willingness to wait and a willingness to change your mind when the facts change.","ja":"多くの人は株価が次に上がるか下がるかを予測しようとします。しかしプロの投資家でも、短期予測を継続して当てることは困難です。\n\nバリュー投資家は企業の利益、財務状態、事業の見通しを調べます。事業価値に比べて割安と思われる株式を探します。配当は株式を保有しながら収入を得る方法にもなります。\n\n忍耐とは悪い知らせを無視することではありません。優良企業も競争や経営の失敗によって弱くなります。良い投資には待つ姿勢と、事実が変われば考えを変える姿勢の両方が必要です。","vocab":[["consistently","継続的に","She studies consistently every morning."],["not necessarily","必ずしも～ではない","A low price does not necessarily mean good value."],["overlook","見落とす","Do not overlook changes in the business."],["remain valid","有効であり続ける","Check whether your reasons remain valid."],["rather than","～ではなく","Read every day rather than only on weekends."]],"is_preview":true},{"date":"2026-11-04","category":"米国ベストセラー書籍","title":"How Small Habits Can Change Your Life","ja_title":"小さな習慣が人生を変える方法","en":"In Atomic Habits, James Clear explains why small daily actions matter. A tiny improvement may be hard to notice at first, but repeated improvements can produce significant results over time.\n\nClear also makes a distinction between goals and systems. A goal might be to read twenty books in a year. A system might be to read ten pages every morning. The daily process helps make progress possible.\n\nThe book describes four ways to build good habits: make them obvious, attractive, easy, and satisfying. For an English learner, reading a short article every morning can be easier to maintain than studying for several hours only once a week.","ja":"ジェームズ・クリアーは『Atomic Habits』で、日々の小さな行動が重要な理由を説明しています。小さな改善は最初は気づきにくくても、繰り返すことで時間とともに大きな成果につながります。\n\n著者は目標と仕組みを区別しています。目標は年間20冊読むこと、仕組みは毎朝10ページ読むこと、といった具合です。日々の過程が進歩を支えます。\n\n本書は良い習慣を作る4つの方法、すなわち明確で、魅力的で、簡単で、満足感があるものにすることを紹介します。英語学習者なら、週1回長時間学ぶより、毎朝短い記事を読む方が継続しやすいでしょう。","vocab":[["over time","時間とともに","Small changes add up over time."],["rather than","～ではなく","Read every day rather than only on weekends."],["achieve a goal","目標を達成する","Daily practice helps you achieve a goal."],["keep a record of","～を記録する","Keep a record of the books you read."],["gradually","徐々に","Your reading speed will gradually improve."]],"is_preview":true}],idx=0,mode='en',done={};
const slot=a=>/^\[(07:00|12:00|17:00)\] /.exec(a.title)?.[1]||'';
const grade=a=>({'07:00':'英検3級程度','12:00':'英検準2級程度','17:00':'英検2級程度'}[slot(a)]||'英検2級程度（従来記事）');
const displayTitle=a=>a.title.replace(/^\[(07:00|12:00|17:00)\] /,'');
const articleKey=a=>a.is_preview?'sample|'+a.date+'|'+a.title:'article|'+a.date+(slot(a)?'|'+slot(a):'');
const seedArticles=articles; const key=articleKey;
function valid(a){return a&&['date','category','title','en','ja'].every(k=>typeof a[k]==='string'&&a[k].trim())&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)&&Array.isArray(a.vocab)&&a.vocab.every(v=>Array.isArray(v)&&v.length>=2&&v.every(x=>typeof x==='string'))}
function merge(old,add){const m=new Map(old.map(a=>[key(a),a]));add.forEach(a=>m.set(key(a),a));return [...m.values()].sort((a,b)=>b.date.localeCompare(a.date)||slot(b).localeCompare(slot(a))||Number(a.is_preview)-Number(b.is_preview))}
try {const saved=JSON.parse(localStorage.getItem('dailyEnglishArticles')||'[]');if(Array.isArray(saved)&&saved.every(valid))articles=merge(saved,articles);done=JSON.parse(localStorage.getItem('dailyEnglishDone')||'{}')||{};}catch{}
function save(){try{localStorage.setItem('dailyEnglishArticles',JSON.stringify(articles));localStorage.setItem('dailyEnglishDone',JSON.stringify(done));return true}catch{return false}}
function importData(raw){const parsed=JSON.parse(raw);const data=Array.isArray(parsed)?parsed:(Array.isArray(parsed.articles)?parsed.articles:[parsed]);if(!data.length||data.length>5000||!data.every(valid))throw Error('記事の必須項目または重要表現の形式を確認してください。');articles=merge(articles,data);idx=articles.findIndex(a=>key(a)===key(data[0]));categories();render();$('#status').textContent=save()?data.length+'件を取り込みました。':'取り込みましたがブラウザに保存できません。JSONで保存してください。';}
const $=s=>document.querySelector(s);
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value;const filtered=articles.map((a,i)=>({...a,i})).filter(a=>(!cat||a.category===cat)&&(!$('#level').value||($('#level').value==='legacy'?!slot(a):slot(a)===$('#level').value))&&(a.title+' '+(a.ja_title||'')+' '+a.en+' '+a.ja+' '+JSON.stringify(a.vocab)).toLowerCase().includes(q));
if(filtered.length&&!filtered.some(a=>a.i===idx))idx=filtered[0].i;$('#count').textContent=filtered.length+' 件の記事';$('#list').replaceChildren(...filtered.map(a=>{let b=node('button','');b.className='story'+(a.i===idx?' active':'');b.append(node('div',a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category),node('div',displayTitle(a)));b.children[0].className='small';b.children[1].className='title';b.onclick=()=>{idx=a.i;render()};return b}));
document.querySelector('.article').hidden=!filtered.length;if(!filtered.length)return;const a=articles[idx];if(!a)return;$('#title').textContent=displayTitle(a);$('#gradeTag').textContent=grade(a);$('#jtitle').textContent=a.ja_title;$('#meta').textContent=a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category;$('#preview').textContent=(a.is_preview?'短縮サンプル':'正式記事')+' · '+a.en.trim().split(/\s+/).length+' words';
let content=$('#content');content.replaceChildren();if(mode==='en'||mode==='both'){content.append(node('h3','English'),node('p',a.en))}
if(mode==='ja'||mode==='both'){content.append(node('h3','日本語訳'),node('p',a.ja))}
$('#vocab').replaceChildren(...a.vocab.map(([word,meaning,example])=>{const tr=document.createElement('tr');const cell=node('td',meaning);if(example)cell.append(node('p',example));tr.append(node('td',word),cell);return tr}));
['En','Both','Ja'].forEach((n,i)=>$('#show'+n).classList.toggle('active',mode===['en','both','ja'][i]));['En','Both','Ja'].forEach((n,i)=>$('#show'+n).setAttribute('aria-pressed',mode===['en','both','ja'][i]));$('#done').textContent=done[a.date+'|'+a.title]?'✓ 読了':'未読'}
function categories(){const current=$('#category').value;$('#category').replaceChildren(new Option('すべて',''),...[...new Set(articles.map(a=>a.category))].map(x=>new Option(x,x)));$('#category').value=current}
$('#search').oninput=render;$('#category').onchange=render;$('#level').onchange=render;['En','Both','Ja'].forEach((n,i)=>$('#show'+n).onclick=()=>{mode=['en','both','ja'][i];render()});$('#done').onclick=()=>{const a=articles[idx],k=a.date+'|'+a.title;done[k]=!done[k];if(!save())$('#status').textContent='既読状態を保存できませんでした。';render()};
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(articles,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='daily_english_articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('ファイルは10MB以内にしてください。');importData(await f.text())}catch(err){$('#status').textContent='読み込み失敗: '+err.message}finally{e.target.value=''}};
$('#importPaste').onclick=()=>{try{importData($('#paste').value);$('#paste').value=''}catch(err){$('#status').textContent='読み込み失敗: '+err.message}};
categories();render();</script></body></html>
