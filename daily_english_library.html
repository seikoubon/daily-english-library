<section class="panel article"><div class="small" id="meta"></div><h2 id="title"></h2><div class="small" id="jtitle"></div><div class="tags"><span class="tag" id="gradeTag"></span><span class="tag" id="preview"></span></div><div class="controls"><button id="showEn" class="active">英文</button><button id="showBoth">英文＋日本語</button><button id="showJa">日本語訳</button><button id="done">未読</button></div><div id="content"></div><details open><summary>重要表現</summary><table class="vocab" id="vocab"></table></details><footer>「短縮サンプル」は試作記事です。正式記事とは区別しています。追加記事・既読状態はこのブラウザに保存されます。別端末へ移す場合はJSONで保存してください。</footer></section></main>
<script>let articles=[{"date":"2026-11-02","category":"AI・テクノロジー","title":"An AI Study Partner: Useful, but Not a Shortcut","ja_title":"AIは学習の相棒。でも近道ではない","en":"Imagine you are reading an English article and find a sentence you cannot understand. In the past, you might have opened a dictionary, searched for a grammar rule, or asked a teacher. Today, you can also ask an AI tool to explain the sentence in simpler English. This is one reason AI is becoming a useful study partner.\n\nOne advantage of AI is that it can adjust to your level. If an explanation is too difficult, you can ask for an easier one. If you already understand the basics, you can request more challenging examples. You can also practice a conversation without worrying about making mistakes in front of other people.\n\nAI can help you build a daily learning routine. For example, you might read a short essay each morning. After reading, you could ask AI to create three questions about the main ideas. You could then answer those questions in your own words. This small exercise helps you check whether you really understood the text.\n\nHowever, there is an important difference between getting an answer and learning something. If AI translates every sentence immediately, you may finish the article quickly but remember very little. Sometimes it is better to guess the meaning from the context before asking for help. The effort you make is part of the learning process.\n\nOne practical rule is to spend a few minutes thinking before asking AI for the answer. Then compare your idea with its explanation and correct any misunderstanding.\n\nAnother problem is that AI is not always correct. It may give an explanation that sounds confident but contains an error. When a fact is important, you should compare the answer with a reliable source. For language questions, a good dictionary or a trusted textbook can be helpful.\n\nYou should also decide what you want AI to do. Instead of saying, “Teach me English,” try a specific request such as, “Ask me five questions about this article, one at a time.” Clear instructions often lead to more useful practice.\n\nFinally, remember that learning is a long journey. You do not need to understand every word today. Reading regularly, reviewing useful expressions, and noticing your progress are more important than finishing one difficult lesson perfectly.\n\nAI can make studying more convenient and personal, but it cannot practice for you. The best approach is to use it as a patient assistant while keeping your own mind active.","ja":"英語の記事を読んでいて、理解できない一文に出会ったと想像してください。以前なら、辞書を開いたり、文法規則を調べたり、先生に質問したりしたでしょう。今では、AIツールにその文をもっと簡単な英語で説明してもらうこともできます。これが、AIが便利な学習の相棒になりつつある理由の一つです。\n\nAIの利点の一つは、あなたのレベルに合わせられることです。説明が難しすぎれば、もっと簡単にしてほしいと頼めます。基礎をすでに理解していれば、より難しい例を求めることもできます。また、ほかの人の前で間違える心配をせずに会話の練習もできます。\n\nAIは毎日の学習習慣を作る助けにもなります。例えば、毎朝短いエッセイを読むとします。読んだ後、主な内容について3つの質問をAIに作ってもらえます。そして、その質問に自分の言葉で答えます。この小さな練習によって、文章を本当に理解したか確認できます。\n\nただし、答えを得ることと何かを学ぶことには重要な違いがあります。AIがすべての文をすぐに翻訳してくれれば、記事を素早く読み終えられるかもしれませんが、ほとんど覚えていないかもしれません。助けを求める前に、文脈から意味を推測した方がよいこともあります。自分で努力することも学習過程の一部なのです。\n\n実践的なルールの一つは、AIに答えを尋ねる前に数分間自分で考えることです。その後、自分の考えをAIの説明と比べ、誤解していた点を直しましょう。\n\nもう一つの問題は、AIが必ずしも正しいとは限らないことです。自信がありそうに聞こえても、間違いを含む説明をすることがあります。重要な事実については、信頼できる情報源と答えを照らし合わせるべきです。言語に関する疑問なら、良い辞書や信頼できる教科書が役立ちます。\n\nまた、AIに何をしてほしいのかを決めることも大切です。「英語を教えて」と言う代わりに、「この記事について5つの質問を、一度に一つずつしてください」のように具体的に頼んでみましょう。明確な指示は、より役立つ練習につながることが多いのです。\n\n最後に、学習は長い道のりだということを忘れないでください。今日、すべての単語を理解する必要はありません。定期的に読み、役立つ表現を復習し、自分の進歩に気づくことは、難しいレッスンを一度で完璧に終えることよりも重要です。\n\nAIは勉強をより便利に、一人ひとりに合ったものにできます。しかし、あなたの代わりに練習することはできません。最も良い方法は、自分の頭を働かせながら、AIを辛抱強い助手として利用することです。","vocab":[["adjust to your level","あなたのレベルに合わせる","A good study plan should adjust to your level."],["in your own words","自分の言葉で","Explain the idea in your own words."],["from the context","文脈から","Try to guess the meaning from the context."],["reliable source","信頼できる情報源","Check important facts with a reliable source."],["one at a time","一度に一つずつ","Please ask me the questions one at a time."]],"is_preview":false},{"date":"2026-11-02","category":"AI・テクノロジー","title":"How AI Is Changing the Way We Learn","ja_title":"AIは私たちの学び方をどう変えているのか","en":"Artificial intelligence is changing how people learn. In a traditional classroom, students often use the same materials at the same speed. AI can offer explanations that match each student's needs.\n\nFor example, an English learner can ask AI to explain a difficult grammar rule using simple words. AI can also provide new examples and exercises. This makes it easier to study at your own speed.\n\nHowever, AI sometimes makes mistakes. Receiving an explanation is not the same as understanding a subject. Real learning still requires practice, careful thinking, and repeated effort.","ja":"人工知能は人々の学び方を変えています。従来の教室では、生徒は同じ教材を同じ速度で学ぶことがよくあります。AIは一人ひとりに合った説明を提供できます。\n\n例えば、英語学習者は難しい文法を簡単な言葉で説明するようAIに頼めます。新しい例文や練習問題も作れます。そのため、自分のペースで勉強しやすくなります。\n\nただし、AIも間違えることがあります。説明を受けることと理解することは別です。実際の学習には練習、慎重な思考、繰り返しの努力が必要です。","vocab":[["at one's own speed","自分のペースで","You can study at your own speed."],["throughout one's life","生涯を通じて","Learning continues throughout one's life."],["depend on","～に頼る","Do not depend on AI for every answer."],["rather than","～ではなく","Read every day rather than only on weekends."],["remain responsible for","～に責任を持ち続ける","You remain responsible for checking the facts."]],"is_preview":true},{"date":"2026-11-03","category":"投資・経済","title":"Why Patience Matters in Investing","ja_title":"投資で忍耐が重要な理由","en":"Many people try to predict the next rise or fall in stock prices. Yet even professional investors find it difficult to make correct short-term predictions consistently.\n\nValue investors study a company's profits, financial condition, and business prospects. They look for shares that appear inexpensive compared with the value of the business. Dividends can also provide income while investors continue to hold their shares.\n\nPatience does not mean ignoring bad news. A strong company can become weak because of competition or poor management. Good investing requires both a willingness to wait and a willingness to change your mind when the facts change.","ja":"多くの人は株価が次に上がるか下がるかを予測しようとします。しかしプロの投資家でも、短期予測を継続して当てることは困難です。\n\nバリュー投資家は企業の利益、財務状態、事業の見通しを調べます。事業価値に比べて割安と思われる株式を探します。配当は株式を保有しながら収入を得る方法にもなります。\n\n忍耐とは悪い知らせを無視することではありません。優良企業も競争や経営の失敗によって弱くなります。良い投資には待つ姿勢と、事実が変われば考えを変える姿勢の両方が必要です。","vocab":[["consistently","継続的に","She studies consistently every morning."],["not necessarily","必ずしも～ではない","A low price does not necessarily mean good value."],["overlook","見落とす","Do not overlook changes in the business."],["remain valid","有効であり続ける","Check whether your reasons remain valid."],["rather than","～ではなく","Read every day rather than only on weekends."]],"is_preview":true},{"date":"2026-11-04","category":"米国ベストセラー書籍","title":"How Small Habits Can Change Your Life","ja_title":"小さな習慣が人生を変える方法","en":"In Atomic Habits, James Clear explains why small daily actions matter. A tiny improvement may be hard to notice at first, but repeated improvements can produce significant results over time.\n\nClear also makes a distinction between goals and systems. A goal might be to read twenty books in a year. A system might be to read ten pages every morning. The daily process helps make progress possible.\n\nThe book describes four ways to build good habits: make them obvious, attractive, easy, and satisfying. For an English learner, reading a short article every morning can be easier to maintain than studying for several hours only once a week.","ja":"ジェームズ・クリアーは『Atomic Habits』で、日々の小さな行動が重要な理由を説明しています。小さな改善は最初は気づきにくくても、繰り返すことで時間とともに大きな成果につながります。\n\n著者は目標と仕組みを区別しています。目標は年間20冊読むこと、仕組みは毎朝10ページ読むこと、といった具合です。日々の過程が進歩を支えます。\n\n本書は良い習慣を作る4つの方法、すなわち明確で、魅力的で、簡単で、満足感があるものにすることを紹介します。英語学習者なら、週1回長時間学ぶより、毎朝短い記事を読む方が継続しやすいでしょう。","vocab":[["over time","時間とともに","Small changes add up over time."],["rather than","～ではなく","Read every day rather than only on weekends."],["achieve a goal","目標を達成する","Daily practice helps you achieve a goal."],["keep a record of","～を記録する","Keep a record of the books you read."],["gradually","徐々に","Your reading speed will gradually improve."]],"is_preview":true},{"date":"2026-11-02","category":"AI・テクノロジー","title":"[12:00] A Place for People in a Digital Town","ja_title":"デジタルな町にも人の居場所を","en":"Imagine a town where you can do almost everything with your phone. You can buy a bus ticket, order lunch, and ask a question at city hall without leaving home. These services can save time. However, a convenient town should also be easy to use for people who do not feel comfortable with technology.\n\nConsider a small library that introduces a new system. Visitors can borrow books by touching a screen. Those who know how to use it may finish quickly. But a visitor using it for the first time might not know where to begin. If there is nobody to ask, a simple visit can become a stressful experience.\n\nThe problem is not always age. A young person with a broken phone may face the same difficulty. Someone who is learning the local language might not understand the instructions. Another person may have trouble seeing small letters. Good design should consider these different situations from the beginning.\n\nOne useful approach is to offer a choice. At the library, a machine can handle simple tasks while a staff member helps visitors with questions. Clear signs can explain each step. The screen can use large letters and familiar words. These changes can make the service easier for many people, not just one group.\n\nLocal residents can also help improve a new service. Before introducing it everywhere, the town could invite a few people to try it. Instead of asking only whether they like it, staff could watch where they stop or make mistakes. A confusing button may seem obvious to its designer but be difficult for an ordinary visitor to understand.\n\nOf course, keeping several ways to use a service takes money and effort. A town cannot offer every possible choice forever. However, removing the old method too quickly may create new problems. People may need extra help, or they may stop using an important service completely.\n\nDigital tools are most useful when they make daily life easier. The goal should not simply be to put more screens in public places. It should be to help more people do what they need to do.\n\nNext time you use a ticket machine or an online form, notice what makes it clear. Then imagine using it without your usual knowledge or equipment. This small change in viewpoint can help us build a town where technology serves people and where asking another person for help is still a normal choice.","ja":"ほとんどすべてのことをスマートフォンでできる町を想像してください。家を出ずにバスの切符を買い、昼食を注文し、市役所に質問できます。こうしたサービスは時間の節約になります。しかし、便利な町は、テクノロジーを使うことに不安がある人にとっても使いやすいものであるべきです。\n\n新しい仕組みを導入する小さな図書館を考えてみましょう。利用者は画面に触れて本を借りられます。使い方を知っている人はすぐに済ませられるでしょう。しかし、初めて使う人は、どこから始めればよいかわからないかもしれません。質問できる人が誰もいなければ、単なる図書館への訪問がストレスの多い体験になりかねません。\n\n問題は必ずしも年齢ではありません。スマートフォンが壊れた若い人も同じ困難に直面するかもしれません。その土地の言葉を学んでいる人は説明を理解できないかもしれません。小さな文字が見えにくい人もいるでしょう。よい設計は、最初からこうした異なる状況を考慮するべきです。\n\n役立つ方法の一つは、選択肢を用意することです。図書館では、機械が簡単な作業を処理し、その間に職員が質問のある利用者を手助けできます。わかりやすい案内表示で各手順を説明できます。画面には大きな文字と身近な言葉を使えます。こうした変更によって、一つの集団だけでなく、多くの人にとってサービスが使いやすくなります。\n\n地域の住民も、新しいサービスの改善に協力できます。全面的に導入する前に、町は何人かに試してもらうことができるでしょう。気に入ったかどうかだけを尋ねる代わりに、職員は利用者がどこで立ち止まったり間違えたりするか観察できます。わかりにくいボタンも、設計者には明白に思えて、普通の利用者には理解しにくいことがあります。\n\nもちろん、サービスを利用する方法を複数維持するには、お金と労力がかかります。町は考えられるすべての選択肢を永遠に提供することはできません。しかし、古い方法を急に廃止すると、新たな問題が生じるかもしれません。人々は追加の手助けを必要としたり、重要なサービスをまったく使わなくなったりするかもしれません。\n\nデジタルの道具は、日常生活を楽にするときに最も役立ちます。目標は、単に公共の場所の画面を増やすことであってはなりません。より多くの人が、必要なことをできるよう助けることであるべきです。\n\n次に券売機やオンラインの入力フォームを使うとき、何がそれをわかりやすくしているかに注目してください。そして、普段の知識や機器がない状態で使うことを想像してみてください。この小さな視点の変化は、テクノロジーが人の役に立ち、ほかの人に助けを求めることも依然として普通の選択肢である町を作る助けになります。","vocab":[["feel comfortable with","～に不安なく対応できる","I feel comfortable with this new app."],["for the first time","初めて","She used the machine for the first time."],["have trouble doing","～するのに苦労する","I have trouble reading small letters."],["from the beginning","最初から","Include clear instructions from the beginning."],["viewpoint","視点・見方","Try to understand her viewpoint."]],"is_preview":false},{"date":"2026-11-02","category":"AI・テクノロジー","title":"[17:00] Who Chooses What You Discover?","ja_title":"あなたの新しい出会いを選ぶのは誰か","en":"Imagine opening a music app after a long day. The first song is exactly what you wanted to hear. The next one is pleasant too. You relax and let the music continue. A service that seems to understand your taste can make an ordinary evening more enjoyable.\n\nNow imagine that the app only offers songs similar to those you already know. Nothing sounds unpleasant, but nothing surprises you either. You may enjoy every song and still miss the chance to discover something different. This raises a question: should technology always give us more of what we like?\n\nConsider a simple recommendation system. It uses your past choices to suggest your next choice. This can be useful when you have a clear goal, such as finding another mystery novel. However, your previous behavior does not describe everything about you. Perhaps you have never tried poetry because nobody has introduced you to a poem you enjoy.\n\nThere is also a difference between choosing something and continuing to watch it. Imagine clicking on an exciting video and then watching several similar ones. Your actions might suggest strong interest, even if you feel dissatisfied afterward. Time spent on a service is not necessarily time well spent.\n\nA better design could give people more control over discovery. For example, a reading app could offer separate buttons for familiar subjects and unfamiliar ones. It could explain why a book was suggested. It could also allow readers to change their preferences easily instead of treating old choices as permanent.\n\nUsers can make small changes too. Before opening an app, decide what you want from it. Are you looking for comfort, information, or a new experience? Once a week, you might choose a book, song, or article without following an automatic suggestion. A friend's recommendation or a library shelf can provide a different starting point.\n\nOf course, unfamiliar choices are not always rewarding. You may dislike a new style of music or stop reading a difficult book. That does not make the experiment useless. Discovering what you do not enjoy can also help you understand your taste.\n\nConvenience has real value, and there is no need to reject helpful technology. Still, a satisfying life includes opportunities that our past behavior cannot predict. Good recommendations should support our choices while leaving room for change. Sometimes the most useful suggestion is one that helps us become curious about something we would never have searched for ourselves.","ja":"長い一日を終えて音楽アプリを開くところを想像してください。最初の曲は、まさに聴きたかった曲です。次の曲も心地よく感じます。あなたはくつろぎ、そのまま音楽を流し続けます。自分の好みを理解しているように思えるサービスは、ありふれた夜をもっと楽しくしてくれます。\n\nでは、そのアプリが、すでに知っている曲と似た曲しか提供しないと想像してください。不快な曲はありませんが、驚きを感じる曲もありません。すべての曲を楽しめたとしても、違うものに出会う機会を逃しているかもしれません。ここで一つの疑問が生まれます。テクノロジーは、いつも私たちの好きなものをさらに多く与えるべきなのでしょうか。\n\n簡単なおすすめの仕組みを考えてみましょう。過去の選択を使って、次の選択を提案します。これは、別の推理小説を見つけるなど、明確な目的があるときには便利です。しかし、以前の行動があなたのすべてを表しているわけではありません。楽しめる詩を誰からも紹介されていないために、詩を読んだことがないだけかもしれません。\n\nまた、何かを選ぶことと、それを見続けることにも違いがあります。刺激的な動画をクリックし、その後に似た動画を何本も見るところを想像してください。後で満足できなかったとしても、あなたの行動は強い関心を示しているように見えるかもしれません。サービスで過ごした時間が、必ずしも有意義に使われた時間とは限らないのです。\n\nよりよい設計では、新しいものとの出会い方を自分で調整できるようにすることが考えられます。例えば、読書アプリなら、なじみのある分野となじみのない分野に別々のボタンを用意できます。なぜその本をすすめたのかを説明することもできます。また、過去の選択を変わらないものとして扱うのではなく、読者が好みの設定を簡単に変更できるようにもできます。\n\n利用者も小さな変更を加えられます。アプリを開く前に、そこから何を得たいのかを決めましょう。安らぎ、情報、それとも新しい体験を求めているのでしょうか。週に一度、自動の提案に従わずに本や曲、記事を選んでみてもよいでしょう。友人のおすすめや図書館の本棚は、異なる出発点になります。\n\nもちろん、なじみのない選択から、いつも得るものがあるとは限りません。新しい音楽のスタイルが好きになれなかったり、難しい本を途中で読むのをやめたりするかもしれません。それでも、その試みが無意味になるわけではありません。楽しめないものを知ることも、自分の好みを理解する助けになります。\n\n便利さには確かな価値があり、役立つテクノロジーを拒む必要はありません。それでも、満足できる人生には、過去の行動からは予測できない機会も含まれます。よいおすすめは、変化の余地を残しながら、私たちの選択を支えるべきです。ときには、自分では決して検索しなかったようなものに興味を持つ手助けをしてくれる提案こそが、最も役立つ提案なのです。","vocab":[["miss the chance to","～する機会を逃す","Don't miss the chance to try something new."],["not necessarily","必ずしも～ではない","A popular book is not necessarily the best choice for you."],["preference","好み","You can change your preferences in the app."],["rewarding","得るものがある・やりがいのある","Learning a new skill can be rewarding."],["leave room for","～の余地を残す","Our plan should leave room for change."]],"is_preview":false},{"date":"2026-11-03","category":"投資・経済","title":"[07:00] Learning About Money with a Simple Budget","ja_title":"簡単な予算でお金の使い方を学ぶ","en":"Many people want to save money, but they do not know how to start. Some people think they need a lot of money to save. This is not true. You can start with a small amount. The important thing is to know how you use your money.\n\nFirst, think about the money you get every month. You may get money from your job or your family. Next, write down the things you buy. For example, you may buy food, drinks, clothes, or books. You may also pay for your phone or the Internet.\n\nWhen you write these things down, you can see where your money goes. You may find something interesting. Perhaps you buy coffee every morning. One cup is not very expensive, but many cups can cost a lot over one month.\n\nNow, make a simple plan. This plan is called a budget. You can put your money into three groups. The first group is for things you need, such as food and your home. The second group is for things you want, such as games and movies. The third group is for money you want to save.\n\nYou do not have to stop buying everything you enjoy. A good budget helps you enjoy life and save money at the same time. For example, you can eat at a restaurant once a week instead of three times a week. You can put the money you do not spend into a savings account.\n\nIt is also good to have a goal. Maybe you want to buy a new computer. Maybe you want to take a trip next summer. Write down your goal and the amount of money you need. Then decide how much you can save each month.\n\nSometimes your plan will not work. You may have to buy something important suddenly. That is okay. Look at your budget again and make a new plan.\n\nYou can also talk about money with your family. You may learn good ideas from each other. Even children can learn to save a little money.\n\nMoney is not the most important thing in life. However, learning to use it well can make your life easier. Start small, keep learning, and take one step at a time.","ja":"多くの人はお金を貯めたいと思っていますが、どう始めればよいかわかりません。貯金するにはたくさんのお金が必要だと考える人もいます。しかし、それは正しくありません。少ない金額からでも始められます。大切なのは、自分がお金をどのように使っているかを知ることです。\n\nまず、毎月入ってくるお金について考えましょう。仕事や家族からお金を得ているかもしれません。次に、自分が買ったものを書き出します。例えば、食べ物、飲み物、洋服、本などです。携帯電話やインターネットの料金も払っているかもしれません。\n\nこうしたものを書き出すと、お金がどこに使われているかわかります。興味深いことに気づくかもしれません。例えば、毎朝コーヒーを買っているとします。1杯はそれほど高くありませんが、1か月分になると大きな金額になることがあります。\n\n次に、簡単な計画を立てましょう。この計画を「予算」と呼びます。お金を3つのグループに分けることができます。1つ目は、食べ物や住まいなど、必要なもののためのお金です。2つ目は、ゲームや映画など、欲しいもののためのお金です。3つ目は、貯金したいお金です。\n\n楽しみのための買い物をすべてやめる必要はありません。よい予算を立てれば、生活を楽しみながら同時にお金を貯めることができます。例えば、週3回の外食を週1回に減らせます。使わなかったお金は貯金口座に入れることができます。\n\n目標を持つことも大切です。新しいパソコンを買いたいかもしれません。来年の夏に旅行へ行きたいかもしれません。目標と必要な金額を書き出しましょう。そして、毎月いくら貯金できるかを決めます。\n\n時には計画どおりにいかないこともあります。突然、何か大切なものを買わなければならないかもしれません。それでも大丈夫です。もう一度予算を見直して、新しい計画を立てましょう。\n\n家族とお金について話すこともよいことです。お互いからよい考えを学べるかもしれません。子どもでも、少しずつお金を貯めることを学べます。\n\nお金は人生で最も大切なものではありません。しかし、上手に使う方法を学ぶことで、生活が楽になることがあります。小さなことから始め、学び続け、一歩ずつ進みましょう。","vocab":[["save money","お金を貯める","I save money every month."],["write down","書き留める","Write down what you buy."],["budget","予算","I have a budget for food."],["instead of","～の代わりに","I drink water instead of juice."],["at the same time","同時に","We can study and have fun at the same time."]],"is_preview":false}],idx=0,mode='en',done={};
const slot=a=>/^\[(07:00|12:00|17:00)\] /.exec(a.title)?.[1]||'';
const grade=a=>({'07:00':'英検3級程度','12:00':'英検準2級程度','17:00':'英検2級程度'}[slot(a)]||'英検2級程度（従来記事）');
const displayTitle=a=>a.title.replace(/^\[(07:00|12:00|17:00)\] /,'');
const articleKey=a=>a.is_preview?'sample|'+a.date+'|'+a.title:'article|'+a.date+(slot(a)?'|'+slot(a):'');
const seedArticles=articles; const key=articleKey;
function valid(a){return a&&['date','category','title','en','ja'].every(k=>typeof a[k]==='string'&&a[k].trim())&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)&&Array.isArray(a.vocab)&&a.vocab.every(v=>Array.isArray(v)&&v.length>=2&&v.every(x=>typeof x==='string'))}
function merge(old,add){const m=new Map(old.map(a=>[key(a),a]));add.forEach(a=>m.set(key(a),a));return [...m.values()].sort((a,b)=>Number(!!a.is_preview)-Number(!!b.is_preview)||b.date.localeCompare(a.date)||slot(b).localeCompare(slot(a)))}
try {const saved=JSON.parse(localStorage.getItem('dailyEnglishArticles')||'[]');if(Array.isArray(saved)&&saved.every(valid))articles=merge(saved,articles);done=JSON.parse(localStorage.getItem('dailyEnglishDone')||'{}')||{};}catch{}
articles=merge([],articles);
function save(){try{localStorage.setItem('dailyEnglishArticles',JSON.stringify(articles));localStorage.setItem('dailyEnglishDone',JSON.stringify(done));return true}catch{return false}}
function importData(raw){const parsed=JSON.parse(raw);const data=Array.isArray(parsed)?parsed:(Array.isArray(parsed.articles)?parsed.articles:[parsed]);if(!data.length||data.length>5000||!data.every(valid))throw Error('記事の必須項目または重要表現の形式を確認してください。');articles=merge(articles,data);idx=articles.findIndex(a=>key(a)===key(data[0]));categories();render();$('#status').textContent=save()?data.length+'件を取り込みました。':'取り込みましたがブラウザに保存できません。JSONで保存してください。';}
const $=s=>document.querySelector(s);
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value;const filtered=articles.map((a,i)=>({...a,i})).filter(a=>(!cat||a.category===cat)&&(!$('#level').value||($('#level').value==='legacy'?!slot(a):slot(a)===$('#level').value))&&(a.title+' '+(a.ja_title||'')+' '+a.en+' '+a.ja+' '+JSON.stringify(a.vocab)).toLowerCase().includes(q));
if(filtered.length&&!filtered.some(a=>a.i===idx))idx=filtered[0].i;$('#count').textContent=filtered.length+' 件の記事';$('#list').replaceChildren(...filtered.map(a=>{let b=node('button','');b.className='story'+(a.i===idx?' active':'');b.append(node('div',(a.is_preview?'サンプル · ':'')+a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category),node('div',displayTitle(a)));b.children[0].className='small';b.children[1].className='title';b.onclick=()=>{idx=a.i;render()};return b}));
document.querySelector('.article').hidden=!filtered.length;if(!filtered.length)return;const a=articles[idx];if(!a)return;$('#title').textContent=displayTitle(a);$('#gradeTag').textContent=grade(a);$('#jtitle').textContent=a.ja_title;$('#meta').textContent=a.date+' '+slot(a)+' · '+grade(a)+' · '+a.category;$('#preview').textContent=(a.is_preview?'短縮サンプル':'正式記事')+' · '+a.en.trim().split(/\s+/).length+' words';
let content=$('#content');content.replaceChildren();if(a.image_url){try{const u=new URL(a.image_url,location.href);if(u.protocol==='https:'||u.origin===location.origin){const figure=document.createElement('figure');figure.style.margin='0 0 20px';const img=document.createElement('img');img.src=u.href;img.alt=a.image_alt||a.ja_title||displayTitle(a);img.style.cssText='display:block;width:100%;height:auto;border-radius:12px';img.decoding='async';img.onerror=()=>figure.remove();figure.append(img);const caption=node('figcaption','AI生成イメージ');caption.className='small';figure.append(caption);content.append(figure)}}catch{}}if(mode==='en'||mode==='both'){content.append(node('h3','English'),node('p',a.en))}
if(mode==='ja'||mode==='both'){content.append(node('h3','日本語訳'),node('p',a.ja))}
$('#vocab').replaceChildren(...a.vocab.map(([word,meaning,example])=>{const tr=document.createElement('tr');const cell=node('td',meaning);if(example)cell.append(node('p',example));tr.append(node('td',word),cell);return tr}));
['En','Both','Ja'].forEach((n,i)=>$('#show'+n).classList.toggle('active',mode===['en','both','ja'][i]));['En','Both','Ja'].forEach((n,i)=>$('#show'+n).setAttribute('aria-pressed',mode===['en','both','ja'][i]));$('#done').textContent=done[a.date+'|'+a.title]?'✓ 読了':'未読'}
function categories(){const current=$('#category').value;$('#category').replaceChildren(new Option('すべて',''),...[...new Set(articles.map(a=>a.category))].map(x=>new Option(x,x)));$('#category').value=current}
$('#search').oninput=render;$('#category').onchange=render;$('#level').onchange=render;['En','Both','Ja'].forEach((n,i)=>$('#show'+n).onclick=()=>{mode=['en','both','ja'][i];render()});$('#done').onclick=()=>{const a=articles[idx],k=a.date+'|'+a.title;done[k]=!done[k];if(!save())$('#status').textContent='既読状態を保存できませんでした。';render()};
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(articles,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='daily_english_articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('ファイルは10MB以内にしてください。');importData(await f.text())}catch(err){$('#status').textContent='読み込み失敗: '+err.message}finally{e.target.value=''}};
$('#importPaste').onclick=()=>{try{importData($('#paste').value);$('#paste').value=''}catch(err){$('#status').textContent='読み込み失敗: '+err.message}};
categories();render();</script></body></html>
